mod_rpg_plus_game_name = RPG Plus
mod_rpg_plus_game_desc = Un RPG pequeño y completo: un prólogo que elige la clase, el misterio de la aldea y el bosque, crafteo, comercio, un desierto y combates por turnos. Solo datos y escenarios.

rpg_plus/map/village = Aldea junto al Bosque Gris
rpg_plus/map/elder_house = Casa del anciano
rpg_plus/map/forest = Bosque Gris
rpg_plus/character/hero = Héroe
rpg_plus/character/slime = Limo
rpg_plus/character/companion = Lira
rpg_plus/character/wolf = Lobo
rpg_plus/item/branches/name = Leña
rpg_plus/item/branches/desc = Ramas secas del Bosque Gris. Basura, pero el mercader paga una moneda por brazada.
rpg_plus/item/stones/name = Piedras
rpg_plus/item/stones/desc = Piedras lisas del bosque. Por algún motivo el mercader las compra a dos monedas cada una.
rpg_plus/item/mushroom/name = Seta del bosque
rpg_plus/item/mushroom/desc = Una seta comestible. Restaura 5 de salud.
rpg_plus/item/elixir/name = Elixir
rpg_plus/item/elixir/desc = Un elixir curativo rojo de la tienda de la aldea. Restaura 20 de salud.
rpg_plus/shop/village_merchant = Tienda del mercader

rpg_plus/item/amber/name = Corazón de ámbar
rpg_plus/item/amber/desc = Dentro hay algo que late. La resina no debería hacer eso. Componente de un farol.
rpg_plus/item/fur_mantle/name = Manto del guardabosques
rpg_plus/item/fur_mantle/desc = Piel y resina: +3 de defensa, +1 de vitalidad. Lo puede llevar cualquier clase.
rpg_plus/item/resin/name = Resina viva
rpg_plus/item/resin/desc = El limo la dejó en lugar de un testamento. Arde incluso bajo la lluvia.
rpg_plus/item/wolf_pelt/name = Piel de lobo plateada
rpg_plus/item/wolf_pelt/desc = El lobo muda el pelo después de muerto. Cálida y resistente.
rpg_plus/item/salve/name = Ungüento del bosque
rpg_plus/item/salve/desc = Restaura 18 de salud. Huele a sopa. No es sopa.
rpg_plus/item/ward_lantern/name = Farol de guardia
rpg_plus/item/ward_lantern/desc = Ámbar en un nido de resina. Llévalo al santuario del bosque.
rpg_plus/quest/ward/name = Una luz en el registro
rpg_plus/quest/ward/0 = Habla con el anciano de la casa del oeste. Averigua por qué el bosque se cierra sobre la aldea.
rpg_plus/quest/ward/1 = Deshazte del lobo junto a la cueva del este del bosque. Encuentra el corazón de ámbar.
rpg_plus/quest/ward/2 = Craftea un farol de guardia en el banco del pozo: ámbar, 2 resinas, 2 haces de leña. Los limos sueltan resina; el mercader también la vende. Luego atraviesa la cueva tras el lobo para llegar al santuario.
rpg_plus/quest/ward/3 = Atraviesa la cueva tras el lobo para llegar al santuario. Decide a quién servirá la nueva luz.
rpg_plus/quest/ward/4 = Vuelve con el anciano a cobrar. El bosque ya conoce tu respuesta.
rpg_plus/quest/apothecary/name = Sopa de uso externo
rpg_plus/quest/apothecary/0 = La herborista junto a la valla del oeste necesita medicina para unas manos quemadas. Habla con ella.
rpg_plus/quest/apothecary/1 = Craftea ungüento del bosque: seta + resina viva. Usa el banco del pozo y luego entrégaselo a la herborista.
rpg_plus/quest/courier/name = La última entrega
rpg_plus/quest/courier/0 = Encuentra al mensajero desaparecido en la parte sur del Bosque Gris. La herborista le dio un paquete.
rpg_plus/quest/courier/1 = Lleva la nota del mensajero a la herborista junto a la valla del oeste.
rpg_plus/recipe/salve/desc = Seta y resina. Funciona mejor por fuera que por dentro.
rpg_plus/recipe/mantle/desc = Piel plateada curtida con resina. Abrigo y protección.
rpg_plus/recipe/lantern/desc = Ámbar, dos resinas y dos haces de leña. La luz necesita un armazón.
rpg_plus/station/name = El banco del pozo
rpg_plus/map/shrine = El bosque recuerda
rpg_plus/desert/map/name = La Marcha Seca
rpg_plus/desert/enemy/scorpion/name = Escorpión de arena
rpg_plus/desert/enemy/beetle/name = Escarabajo del desierto
