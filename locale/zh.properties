mod_rpg_plus_game_name = RPG Plus
mod_rpg_plus_game_desc = 一款完整的小型 RPG：选择职业的序章、村庄与森林之谜、制作、交易、沙漠和回合制战斗——只有数据和剧本。

rpg_plus/map/village = 灰森林旁的村庄
rpg_plus/map/elder_house = 村长的家
rpg_plus/map/forest = 灰森林
rpg_plus/character/hero = 英雄
rpg_plus/character/slime = 史莱姆
rpg_plus/character/companion = 莉拉
rpg_plus/character/wolf = 狼
rpg_plus/item/branches/name = 柴火
rpg_plus/item/branches/desc = 灰森林里的干树枝。是破烂，但商人每捆给一枚硬币。
rpg_plus/item/stones/name = 石头
rpg_plus/item/stones/desc = 森林里光滑的石头。不知为何，商人每块出两枚硬币收购。
rpg_plus/item/mushroom/name = 森林蘑菇
rpg_plus/item/mushroom/desc = 一种可食用的蘑菇。恢复 5 点生命。
rpg_plus/item/elixir/name = 药剂
rpg_plus/item/elixir/desc = 村里商店卖的红色治疗药剂。恢复 20 点生命。
rpg_plus/shop/village_merchant = 商人的店

rpg_plus/item/amber/name = 琥珀之心
rpg_plus/item/amber/desc = 里面有什么东西在跳动。树脂不该这样。是灯笼的部件。
rpg_plus/item/fur_mantle/name = 护林人披风
rpg_plus/item/fur_mantle/desc = 毛皮与树脂：+3 防御，+1 体力。任何职业都能穿。
rpg_plus/item/resin/name = 活树脂
rpg_plus/item/resin/desc = 史莱姆留下它代替遗言。雨中也能燃烧。
rpg_plus/item/wolf_pelt/name = 银狼毛皮
rpg_plus/item/wolf_pelt/desc = 狼死后还在脱毛。温暖又结实。
rpg_plus/item/salve/name = 森林药膏
rpg_plus/item/salve/desc = 恢复 18 点生命。闻起来像汤。不是汤。
rpg_plus/item/ward_lantern/name = 守望灯笼
rpg_plus/item/ward_lantern/desc = 树脂摇篮中的琥珀。把它带到森林圣所去。
rpg_plus/quest/ward/name = 账本上的光
rpg_plus/quest/ward/0 = 去西边的房子找村长谈谈。弄清楚森林为何逼近村庄。
rpg_plus/quest/ward/1 = 除掉东部森林洞穴旁的狼。找到琥珀之心。
rpg_plus/quest/ward/2 = 在水井旁的工作台制作守望灯笼：琥珀、2 个树脂、2 捆柴火。史莱姆会掉落树脂，商人也有出售。然后穿过狼所在的洞穴前往圣所。
rpg_plus/quest/ward/3 = 穿过狼身后的洞穴到达圣所。决定新的光将为谁服务。
rpg_plus/quest/ward/4 = 回到村长那里领取报酬。森林已经知道你的答案了。
rpg_plus/quest/apothecary/name = 外用汤剂
rpg_plus/quest/apothecary/0 = 西侧篱笆旁的草药师需要治疗烧伤双手的药。去和她谈谈。
rpg_plus/quest/apothecary/1 = 制作森林药膏：蘑菇 + 活树脂。在水井工作台制作，然后交给草药师。
rpg_plus/quest/courier/name = 最后的投递
rpg_plus/quest/courier/0 = 在灰森林南部找到失踪的信使。草药师把一个包裹交给了他。
rpg_plus/quest/courier/1 = 把信使的便条拿给西侧篱笆旁的草药师。
rpg_plus/recipe/salve/desc = 蘑菇和树脂。外敷比内服更有效。
rpg_plus/recipe/mantle/desc = 用树脂鞣制的银色毛皮。保暖又防护。
rpg_plus/recipe/lantern/desc = 琥珀、2 个树脂和 2 捆柴火。光需要一个框架。
rpg_plus/station/name = 水井工作台
rpg_plus/map/shrine = 森林记得
rpg_plus/desert/map/name = 干涸行军路
rpg_plus/desert/enemy/scorpion/name = 沙蝎
rpg_plus/desert/enemy/beetle/name = 沙漠甲虫
