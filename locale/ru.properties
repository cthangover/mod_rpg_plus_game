mod_rpg_plus_game_name = RPG Plus
mod_rpg_plus_game_desc = Полная маленькая RPG: пролог с выбором класса, тайна деревни и леса, крафт, торговля, пустыня и пошаговые бои — только данные и сценарии.

rpg_plus/item/resin/name = Живая смола
rpg_plus/item/resin/desc = Слизень оставил её вместо завещания. Горит даже под дождём.
rpg_plus/item/wolf_pelt/name = Серебристая шерсть
rpg_plus/item/wolf_pelt/desc = Волк линяет посмертно. Тёплая и прочная.
rpg_plus/item/amber/name = Сердце янтаря
rpg_plus/item/amber/desc = Внутри бьётся что-то, чего в смоле быть не должно. Нужно для фонаря.
rpg_plus/item/salve/name = Лесная мазь
rpg_plus/item/salve/desc = Восстанавливает 18 здоровья. Пахнет супом. Не суп.
rpg_plus/item/ward_lantern/name = Сторожевой фонарь
rpg_plus/item/ward_lantern/desc = Янтарь в смоляном гнезде. Отнеси к лесному святилищу.
rpg_plus/item/fur_mantle/name = Плащ лесного стража
rpg_plus/item/fur_mantle/desc = Шерсть и смола: +3 защиты, +1 выносливости. Подходит любому классу.
rpg_plus/quest/ward/name = Свет по ведомости
rpg_plus/quest/ward/0 = Поговори со старостой в западном доме. Узнай, почему лес подходит к деревне.
rpg_plus/quest/ward/1 = Избавься от волка у пещеры на востоке леса. Найди янтарное сердце.
rpg_plus/quest/ward/2 = На верстаке у колодца изготовь сторожевой фонарь: янтарь, 2 смолы, 2 связки веток. Смола выпадает из слизней и продаётся у торговца. Затем через пещеру за волком пройди к святилищу.
rpg_plus/quest/ward/3 = Пройди через пещеру за волком к святилищу. Реши, кому будет служить новый свет.
rpg_plus/quest/ward/4 = Вернись к старосте за расчётом. Лес уже знает твой ответ.
rpg_plus/quest/apothecary/name = Суп наружного применения
rpg_plus/quest/apothecary/0 = Травница у западной ограды ищет лекарство для обожжённых рук. Поговори с ней.
rpg_plus/quest/apothecary/1 = Изготовь лесную мазь: гриб + живая смола. Верстак у колодца. Отдай мазь травнице.
rpg_plus/quest/courier/name = Последняя доставка
rpg_plus/quest/courier/0 = Найди пропавшего курьера в южной части Серого леса. Травница дала ему посылку.
rpg_plus/quest/courier/1 = Покажи найденную записку травнице у западной ограды.
rpg_plus/recipe/salve/desc = Гриб, смола. Снаружи помогает лучше, чем внутри.
rpg_plus/recipe/mantle/desc = Серебристая шерсть, пропитанная смолой. Согревает и держит удар.
rpg_plus/recipe/lantern/desc = Янтарное сердце, две смолы, две связки веток. Свету нужен каркас.
rpg_plus/station/name = Верстак у колодца
rpg_plus/map/shrine = Лес помнит

rpg_plus/desert/map/name=Сухой предел
rpg_plus/desert/enemy/scorpion/name=Песчаный скорпион
rpg_plus/desert/enemy/beetle/name=Пустынный жук

rpg_plus/map/village = Деревня у Серого леса
rpg_plus/map/elder_house = Дом старосты
rpg_plus/map/forest = Серый лес
rpg_plus/character/hero = Герой
rpg_plus/character/slime = Слизень
rpg_plus/character/companion = Лира
rpg_plus/character/wolf = Волк
rpg_plus/item/branches/name = Хворост
rpg_plus/item/branches/desc = Сухие ветки из Серого леса. Хлам, но торговец платит монету за охапку.
rpg_plus/item/stones/name = Камни
rpg_plus/item/stones/desc = Гладкие лесные камни. Торговец почему-то покупает их по две монеты.
rpg_plus/item/mushroom/name = Лесной гриб
rpg_plus/item/mushroom/desc = Съедобный гриб. Восстанавливает 5 ед. здоровья.
rpg_plus/item/elixir/name = Эликсир
rpg_plus/item/elixir/desc = Красный целебный эликсир из деревенской лавки. Восстанавливает 20 ед. здоровья.
rpg_plus/shop/village_merchant = Лавка торговца
