rpg_plus/prologue/title = 十字路
rpg_plus/prologue/line1 = 道標は正直に三方向を同時に指している。どれにも行きたくない。
rpg_plus/prologue/line2 = 下には灰色の森のそばの村。狼を恐れない者が要るという。恐れていても、黙っていればいい。財布で鳴る硬貨二十五枚——前の人生の残りのすべて。
rpg_plus/prologue/ask = ここに来る前、お前は何者だった？
rpg_plus/prologue/opt_warrior = 兵士だ。剣は単純だ。
rpg_plus/prologue/opt_mage = 魔法使いの弟子だ。炎は言うことを聞く。
rpg_plus/prologue/opt_rogue = 流れ者だ。誰とでも話はつけられる。
rpg_plus/prologue/warrior = 背中の木の剣が兵舎に残してもらえたすべて。それと先に殴る癖。
rpg_plus/prologue/mage = 杖は温かく、水晶が唸る。師は、炎は賢い者に従うと言った。残りの者については言いそびれた。
rpg_plus/prologue/rogue = 袖に短剣、笑顔はいつでも。扉は笑顔で開く。開かない扉は短剣で。
rpg_plus/prologue/seer = 道標のそばに薄紫の外套の旅人が座っている。結末をもう知っていて、先に退屈しているような目つきだ。
rpg_plus/prologue/seer_ask = 彼女に何と言う？
rpg_plus/prologue/opt_ask_way = 丁寧に道を尋ねる［カリスマ 10］
rpg_plus/prologue/opt_pass = 黙って通り過ぎる
rpg_plus/prologue/gift = 「礼儀正しいね。珍しい」彼女はクローバーのお守りを放ってよこす。「持ってな。運は尋ねる者を好む。長続きはしないけどね」
rpg_plus/prologue/snub = 「自分で見つけな」彼女はそっぽを向く。「みんな見つける。生きたまま見つける者もいる」
rpg_plus/prologue/path = 小道は村へ下っていく。霧はしぶしぶ晴れる。どこへ行くのか知っているかのように。
rpg_plus/prologue/mage_hint = 杖が小さく火花を弾く。狼は火が嫌いだという。杖のほうも狼が嫌いらしい。
rpg_plus/prologue/sheet_hint = 自分のシートは上のバーの本のボタン：ステータス、レベル、装備。装備はかばんから身に着ける。
rpg_plus/yard/intro = 「さて」師匠は腕を組む。「見せてみろ。死ぬなよ、責任は取らん」
rpg_plus/yard/ask = 何をする？
rpg_plus/yard/opt_drill = 打ち込み稽古（経験値 +20、一度だけ）
rpg_plus/yard/opt_log = 丸太を頭上に持ち上げる［筋力 12］
rpg_plus/yard/opt_back = 村へ戻る
rpg_plus/yard/drill_done = 「悪くない。あと百回やれば戦士に見えるさ。遠目にはな」
rpg_plus/yard/drilled = 「今日はここまで。筋肉は寝ている間に育つ。寝ろ」
rpg_plus/yard/log_ok = 「はっ！持ち上げたな」師匠が小瓶を放る。「力の強壮剤だ。礼はいらん。空きっ腹で飲むなよ」
rpg_plus/yard/log_again = 「また？見栄っ張りめ。強壮剤はもうない。敬意ならある。少しな」
rpg_plus/yard/log_fail = 「丸太の勝ちだ。よくある。もう少し育つか、商人から力の強壮剤を買え。効くらしい。商人が言うには」
rpg_plus/trainer/hello = 「新入りか？手を見せろ。ほう……鍛えられなくはない。本気でやればな」
rpg_plus/trainer/veteran = 「たくましくなったな。レベル三か。そのうち俺に教え始めるんだろう。やめろ」
rpg_plus/trainer/opt_yard = 稽古場へ行く
rpg_plus/trainer/opt_later = 今はいい
rpg_plus/trainer/bye = 「手がうずいたら来い。狼に食われたら来なくていい」
rpg_plus/seer/hello = 「この先を知りたいかい？手をお出し。そっちじゃない——盗みに使わないほうの手だよ」
rpg_plus/seer/fortune = 「洞窟の狼は鋼より火を恐れる。それと盾のないところを打ちな。ここまでは無料。残りは有料だよ」
rpg_plus/seer/charm = 「それとお守りを見つけな。運は空の手にはしがみつかない。満ちた手にも長くはね」
rpg_plus/seer/fog = 「霧……何も見えない。お前に未来がないか、今日の星の機嫌が悪いか。明日おいで。明日があればね」
rpg_plus/chest/closed = 宝箱に鍵はない。持ち主はお人好しか、中身が希望だけか。
rpg_plus/chest/coins = 硬貨が十枚。持ち主はお人好しだった。過去形で。
rpg_plus/chest/empty = 空っぽだ。信頼は硬貨と一緒に尽きた。
rpg_plus/slime/pet = 飼いならされたスライム。誰かが手から餌をやっている。手はまだ無事だ。

rpg_plus/chest/house_empty = 空っぽだ。もう全部持っていった。
rpg_plus/chest/forest = 森の中の宝箱。中には干しキノコと、誰かの失われた希望。キノコをいただく。
rpg_plus/chest/house = 宝箱の中には古い靴下と「さわるな」と書かれたメモ。もう遅い。靴下の下には硬貨が 3 枚。
rpg_plus/door/locked = 鍵がかかっている。扉の向こうで誰かが、留守のふりを必死にしている。
rpg_plus/merchant/line1 = 「おや、お客さんだ！ エリクサーは新鮮、沈殿もほとんどなし。森のガラクタも持ってきな、何でも買い取るよ。まあ、ほとんど何でもね。」
rpg_plus/slime/line1 = スライムが小道をふさぎ、挑むようにごぼごぼ鳴っている。
rpg_plus/sign/village = 「東：灰色の森。西：こっちも森だが、そっちへは行かない。」
rpg_plus/villager/line1 = 「森にはスライムがいるらしい。小さいけど、ブーツに入り込まれると腹が立つんだ。」
rpg_plus/villager/ask = 一緒に森へ行かない？
rpg_plus/villager/alone = いいえ、一人で大丈夫。
rpg_plus/villager/join = 「猟師じゃないけど、靴は丈夫よ。案内して。」
rpg_plus/villager/bye = 「じゃあ、スライムに待ってもらいな。」
rpg_plus/wolf/line1 = 洞窟のそばに狼が座っている。村長のヤギを見るような目つきで、こちらを値踏みしている。
rpg_plus/wolf/line2 = 「グルルル。」
rpg_plus/house/enter = 家の中は薬草と蝋と、少しだけ村長の匂いがする。
rpg_plus/forest/enter = 灰色の森。誰かが食べられている場所にしかない静けさだ。
rpg_plus/intro/title = 灰色の森のそばの村
rpg_plus/intro/line1 = 朝。ニワトリは夜明け前に声がかれ、村長はもう三度も少年をあなたを呼びによこした。
rpg_plus/intro/controls = WASD か矢印キーで歩く。E か F で話す、開ける、読む。
rpg_plus/pickup/branches = ひと抱えの乾いた柴。村の商人なら引き取ってくれる。何でも買う人だ。
rpg_plus/pickup/stones = すべすべした石がいくつか。役に立たない、つまり売り物だ。
rpg_plus/pickup/mushroom = しっかりした森のキノコ。食べれば元気になる。

rpg_plus/winter/map/name = 白い峠
rpg_plus/winter/enter/title = 白い峠
rpg_plus/winter/enter/line = 道標は近道を約束していた。凍傷については黙っていた。
rpg_plus/winter/sign = 東は砂漠。天気には相談していないらしい。
rpg_plus/winter/chest_reward = 宝箱に ${reward} 枚のコインが入っている。

rpg_plus/barrel/empty = 空っぽだ。ゴミまで持っていかれた。
rpg_plus/barrel/found_2_coins_branches = 樽の中に小銭があった：硬貨 2 枚、柴 1 束。
rpg_plus/barrel/found_2_coins_resin = 樽の中に小銭があった：硬貨 2 枚、樹脂 1 個。
rpg_plus/barrel/found_3_coins_elixir = 樽の中に小銭があった：硬貨 3 枚、エリクサー 1 本。
rpg_plus/barrel/found_4_coins_resin = 樽の中に小銭があった：硬貨 4 枚、樹脂 1 個。
rpg_plus/desert/caravan = 隊商は去った。値段は残った。そのせいで安くなったものは何もない。
rpg_plus/desert/enemy/beetle = 甲虫が砂をひっかいている。通行料は肉で取る。
rpg_plus/desert/enemy/scorpion = サソリが尻尾を持ち上げる。交渉は短く終わるだろう。
rpg_plus/desert/enter = 最後の木を過ぎると日陰が途切れる。ここのサソリは、この土地の希望より大きい。
rpg_plus/desert/house = 扉の張り紙：「涼しくなったら戻ります」。インクはかすれている。
rpg_plus/woodland/amber/recovered = 琥珀の心臓は洞窟のそばに残されていた。今度はお前が持って行く。
rpg_plus/woodland/beacon/1 = 空の揺りかご。ここには前にも光が運ばれた。そして持ち去られた。
rpg_plus/woodland/beacon/2 = 守りのランタンが要る：琥珀、樹脂 2、柴 2 束。作業台は村の井戸のそばにある。
rpg_plus/woodland/beacon/3 = 「光の借金：三十年」。根の下の声が紙のように擦れる。「誰が払うのだ？」
rpg_plus/woodland/beacon/4 = 光を森に返す。村は自分たちの光を作る方法を覚えればいい。
rpg_plus/woodland/beacon/5 = ランタンは村に残し、公正な契約を交渉する。
rpg_plus/woodland/beacon/6 = まずは考える
rpg_plus/woodland/beacon/7 = ランタンを石の上に置き、覆いを開ける。琥珀から細い根が伸びる。
rpg_plus/woodland/beacon/8 = 「承諾」。間。「領収書は発行されない」。
rpg_plus/woodland/beacon/9 = 「村に一つのランタン。その代わり、古い道の先で斧は一本も振るわないこと。そして、帳簿は村長がつけない。」
rpg_plus/woodland/beacon/10 = 「合意」。石に手形が浮かぶ。指が多すぎる。それでもお前は自分の手を重ねる。
rpg_plus/woodland/beacon/11 = 帰り道は楽に感じる。安全になったわけではない。道がお前の名前を覚えただけだ。
rpg_plus/woodland/beacon/12 = ランタンの光は安定している。根の下の誰かが、慎重に行を消している。
rpg_plus/woodland/beacon/13 = 石に若葉が生える。帳簿に根が張った。
rpg_plus/woodland/courier/1 = 「荷物は届けた」。配達人は空の鞄を見せる。「受取人はサインしなかった。根が生えている」。
rpg_plus/woodland/courier/2 = 彼はメモを差し出す：「森は怒っていない。数えているのだ。光を返すか、公正な支払いを始めろ」。
rpg_plus/woodland/courier/3 = 「薬草師に持って行け。俺はここで待つ。契約では昼飯が出るはずなんだ。契約書は持っていないが、昼飯は出る」。
rpg_plus/woodland/courier/4 = 「行けよ。後から行く。まず根を受け取る相手を探さないと」。
rpg_plus/woodland/elder/1 = 「狼はヤギを襲う。森はランプを消す。帳簿には犯人が一人必要だ。狼はもう記載されている」。
rpg_plus/woodland/elder/2 = 狼がランプを消せるのか？
rpg_plus/woodland/elder/3 = どこで探せばいい？
rpg_plus/woodland/elder/4 = 「いや。だが『不明』と書くには書類があと三枚要る」。
rpg_plus/woodland/elder/5 = 村長はテーブルに壊れたランタンを置く。空の揺りかごは拳ほどの大きさだ。
rpg_plus/woodland/elder/6 = 「昔は祠で琥珀が燃えていた。その後、村に光が必要だと判断した。森は違う意見だったがな」。
rpg_plus/woodland/elder/7 = 「東へ、池の向こうだ。狼が洞窟を守っている。追い払え。琥珀が見つかっても売るな。一度もうけたことがあるからな」。
rpg_plus/woodland/elder/8 = 「琥珀を持っているのか？ それなら森はもう狼さえ信用していないということだ」。
rpg_plus/woodland/elder/9 = 「井戸のそばに作業台がある。琥珀、樹脂 2、柴 2 束で守りのランタンができる。スライムは樹脂を残す。商人も在庫を持っている」。
rpg_plus/woodland/elder/10 = 「それから洞窟を抜けて祠へ。光の仕事があるだろう。どんな仕事かは聞かないでくれ」。
rpg_plus/woodland/elder/11 = 「村は再び眠りについた」。村長は硬貨を三十五枚数える。「今月初めて、暗がりへの苦情が一件も来なかった」。
rpg_plus/woodland/elder/12 = 「せめてこれからは、どれだけ取られるかが分かるな」。
rpg_plus/woodland/elder/13 = 村長は机のランプを消す。外では明かりが強くなっていく。
rpg_plus/woodland/elder/14 = 「光の税は廃止だ」。硬貨を三十五枚数える。「そんな目で見るな。暗闇に税をかけるつもりもない。今のところはな」。
rpg_plus/woodland/elder/15 = 「帳簿は閉じた。ヤギは無事だ。もしまた古い謎を見つけたら、まず誰が管理しているのかを調べろ」。
rpg_plus/woodland/elder/ready = 「できたか？ なら洞窟を抜けて祠へ。光が誰に仕えるか決めるまで、覆いは閉じておけ」。
rpg_plus/woodland/hearth/1 = 炉端では誰も英雄的な行いを求めない。貴重な場所だ。
rpg_plus/woodland/herbalist/1 = 「古いランタンで手を火傷した。村長は普通の樹脂だと言った。普通の樹脂は噛みついたりしない」。
rpg_plus/woodland/herbalist/2 = 「井戸の作業台でキノコをスライムの樹脂と混ぜな。軟膏を持ってくるんだ。『森の』というのは材料のことで、効き目の保証じゃないよ」。
rpg_plus/woodland/herbalist/3 = 「森の軟膏が要るんだよ。キノコと樹脂だ。両方ないなら、東の家の商人が金で用意してくれる」。
rpg_plus/woodland/herbalist/4 = 森の軟膏を渡す
rpg_plus/woodland/herbalist/5 = 今は自分で持っておく
rpg_plus/woodland/herbalist/6 = 薬草師は蓋を歯で開け、黙って手に塗る。それから初めて財布に手を伸ばす。
rpg_plus/woodland/herbalist/7 = 「十二枚だ。それと別の仕事がある。配達人が予備の芯を祠へ持って行ったきり戻らない。森の南を探しておくれ」。
rpg_plus/woodland/herbalist/8 = 「配達人はまだ森の中だ。道の南。緑のベストに、嫌な予感がする」。
rpg_plus/woodland/herbalist/9 = 彼女は紙を二度読む。二度目にはひっくり返す。裏には何も書かれていない。
rpg_plus/woodland/herbalist/10 = 「『森は怒っていない。数えているのだ』」。彼女は紙をしまう。「ランタンには樹脂二つで足りる。三つ目は取っておきな。配達料だよ」。
rpg_plus/woodland/herbalist/11 = 「手は治った。配達人も無事。休みたいなら井戸のそばの炉端を使いな。処方箋はいらない」。
rpg_plus/woodland/lamplighter/1 = 「ランプを数えている。昨日は七つ。今日は六つ。七つ目は私を数えているよ」。
rpg_plus/woodland/lamplighter/2 = 「新しいランタンを三回磨いた。一度も山羊を要求してこない。進歩だ」。
rpg_plus/woodland/lamplighter/3 = 「森は明るくなった。村は暗くなった。それでも、光はもう利息をとらない」。
rpg_plus/woodland/shrine/1 = アーチの向こうで誰かが数えている。「村」という言葉でつかえて、また最初から数え直す。
rpg_plus/woodland/waystone/1 = 石に刻まれている：「祠へ：東の洞窟を抜けよ。光を持ち出すな。条件を書き換えるな」。
rpg_plus/woodland/workbench/1 = 作業台には指示書がある：「味見するな。匂いを嗅ぐな。製品が喋り出したら、製作者は責任を負わない」。
