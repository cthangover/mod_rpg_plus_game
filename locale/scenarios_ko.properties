rpg_plus/prologue/title = 갈림길
rpg_plus/prologue/line1 = 이정표는 정직하게 세 방향을 한꺼번에 가리킨다. 어디로도 가고 싶지 않다.
rpg_plus/prologue/line2 = 아래에는 회색 숲 곁의 마을이 있다. 늑대를 두려워하지 않는 누군가가 필요하단다. 아니면 두려워하되 조용히. 지갑에서 동전 스물다섯 닢이 짤랑인다 — 지난 삶에서 남은 전부.
rpg_plus/prologue/ask = 여기 오기 전, 너는 누구였지?
rpg_plus/prologue/opt_warrior = 병사. 검은 단순하지.
rpg_plus/prologue/opt_mage = 마법사의 제자. 불이 내 말을 듣지.
rpg_plus/prologue/opt_rogue = 떠돌이. 누구와도 말은 통하지.
rpg_plus/prologue/warrior = 등에 멘 나무 검이 병영이 남겨 준 전부다. 먼저 치는 버릇과 함께.
rpg_plus/prologue/mage = 지팡이는 따뜻하고 수정이 웅웅댄다. 스승은 불이 영리한 자의 말을 듣는다고 했다. 나머지에 대해서는 말할 틈이 없었다.
rpg_plus/prologue/rogue = 소매엔 단검, 미소는 언제든. 문은 미소에 열린다. 안 열리는 문은 단검에.
rpg_plus/prologue/seer = 이정표 옆에 연보랏빛 망토의 나그네가 앉아 있다. 결말을 이미 알고, 미리 지루해하는 눈빛이다.
rpg_plus/prologue/seer_ask = 그녀에게 뭐라고 할까?
rpg_plus/prologue/opt_ask_way = 정중하게 길을 묻는다 [매력 10]
rpg_plus/prologue/opt_pass = 말없이 지나친다
rpg_plus/prologue/gift = “예의 바르네. 별일이야.” 그녀가 클로버 부적을 던져 준다. “가져. 행운은 묻는 자를 좋아해. 오래는 아니지만.”
rpg_plus/prologue/snub = “알아서 찾게 될 거야.” 그녀가 고개를 돌린다. “다들 찾아. 어떤 이들은 살아서.”
rpg_plus/prologue/path = 오솔길이 마을로 내려간다. 안개가 마지못해 걷힌다. 네가 어디로 가는지 아는 것처럼.
rpg_plus/prologue/mage_hint = 지팡이가 조용히 불꽃을 튀긴다. 늑대는 불을 싫어한다지. 지팡이도 늑대를 싫어하는 모양이다.
rpg_plus/prologue/sheet_hint = 네 시트는 위쪽 막대의 책 버튼이야: 능력치, 레벨, 장비. 장비는 가방에서 착용해.
rpg_plus/yard/intro = “자,” 스승이 팔짱을 낀다. “보여 봐. 죽지만 마라. 난 책임 안 진다.”
rpg_plus/yard/ask = 뭘 할까?
rpg_plus/yard/opt_drill = 타격 훈련 (+20 경험치, 한 번)
rpg_plus/yard/opt_log = 통나무를 머리 위로 든다 [힘 12]
rpg_plus/yard/opt_back = 마을로 돌아간다
rpg_plus/yard/drill_done = “나쁘지 않군. 이런 걸 백 번만 더 하면 싸움꾼으로 보일 거다. 멀리서 보면.”
rpg_plus/yard/drilled = “오늘은 그만. 근육은 잘 때 자란다. 가서 자라.”
rpg_plus/yard/log_ok = “하! 들었군.” 스승이 작은 병을 던져 준다. “힘의 강장제다. 고맙단 말은 됐고. 빈속에 마시지 마라.”
rpg_plus/yard/log_again = “또? 허세는. 강장제는 더 없다. 존중은 있다. 조금.”
rpg_plus/yard/log_fail = “통나무가 이겼군. 그럴 수 있지. 좀 더 크든가, 상인한테 힘의 강장제를 사라. 효과 있다더라. 상인이 그러더라.”
rpg_plus/trainer/hello = “신참이냐? 손 좀 보자. 아하... 해볼 만은 하군. 아주 마음먹으면.”
rpg_plus/trainer/veteran = “단단해졌군. 3레벨이라. 곧 나를 가르치려 들겠지. 하지 마라.”
rpg_plus/trainer/opt_yard = 수련장으로 간다
rpg_plus/trainer/opt_later = 지금은 됐어
rpg_plus/trainer/bye = “손이 근질거리면 와라. 늑대한테 먹히면 안 와도 된다.”
rpg_plus/seer/hello = “무엇이 기다리는지 알고 싶어? 손을 줘. 그거 말고 — 도둑질 안 하는 손.”
rpg_plus/seer/fortune = “동굴의 늑대는 강철보다 불을 더 무서워해. 그리고 보호막이 없는 데를 쳐. 여기까진 공짜야. 나머진 아니고.”
rpg_plus/seer/charm = “그리고 부적 하나 구해. 행운은 빈손에 붙어 있지 않아. 가득 찬 손에도 오래는 아니고.”
rpg_plus/seer/fog = “안개... 아무것도 안 보여. 너한테 미래가 없거나, 오늘 별들이 심술이 났거나. 내일 와. 내일이 있다면.”
rpg_plus/chest/closed = 상자는 잠겨 있지 않다. 주인이 사람을 잘 믿거나, 안에 희망만 넣어 두었거나.
rpg_plus/chest/coins = 동전 열 닢. 주인은 사람을 잘 믿었다. 과거형이다.
rpg_plus/chest/empty = 비었다. 믿음은 동전과 함께 바닥났다.
rpg_plus/slime/pet = 길들인 슬라임. 누군가 손으로 먹이를 준다. 손은 아직 멀쩡하다.

rpg_plus/chest/house_empty = 비어 있다. 이미 다 가져갔다.
rpg_plus/chest/forest = 숲속의 상자. 안에는 말린 버섯과 누군가의 잃어버린 희망. 버섯을 챙긴다.
rpg_plus/chest/house = 상자 안에는 낡은 양말과 '만지지 마시오'라고 쓴 쪽지. 이미 늦었다. 양말 밑에 동전 세 닢.
rpg_plus/door/locked = 잠겨 있다. 문 너머에서 누군가 아무도 없는 척하려고 무척 애쓰고 있다.
rpg_plus/merchant/line1 = "오, 손님이다! 엘릭서 신선해요, 앙금도 거의 없어요. 숲의 잡동사니도 가져와요, 전부 사들일게요. 뭐, 거의 전부."
rpg_plus/slime/line1 = 슬라임이 오솔길을 막고 도전적으로 꾸르륵거린다.
rpg_plus/sign/village = "동쪽: 잿빛 숲. 서쪽: 거기도 숲이지만 우리는 가지 않는다."
rpg_plus/villager/line1 = "숲에 슬라임이 있대. 작긴 한데 부츠 속에 기어들어 오면 짜증 나."
rpg_plus/villager/ask = 나랑 숲에 같이 갈래?
rpg_plus/villager/alone = 아니, 혼자 할게.
rpg_plus/villager/join = "사냥꾼은 아니지만 신발은 튼튼해. 앞장서."
rpg_plus/villager/bye = "그럼 슬라임들이 기다리겠네."
rpg_plus/wolf/line1 = 동굴 옆에 늑대가 앉아 있다. 촌장네 염소를 보는 눈빛으로 당신을 훑어본다.
rpg_plus/wolf/line2 = "크르르."
rpg_plus/house/enter = 집 안에서 약초와 밀랍 냄새, 그리고 촌장 냄새가 살짝 난다.
rpg_plus/forest/enter = 잿빛 숲. 누군가가 먹히고 있는 곳에서만 나는 고요함이다.
rpg_plus/intro/title = 잿빛 숲 옆 마을
rpg_plus/intro/line1 = 아침. 수탉들은 동트기 전에 목이 쉬었고, 촌장은 벌써 세 번이나 소년을 보내 당신을 불렀다.
rpg_plus/intro/controls = WASD 또는 방향키로 걷는다. E 또는 F로 말하고, 열고, 읽는다.
rpg_plus/pickup/branches = 마른 땔감 한 아름. 마을 상인이 받아 줄 것이다. 그는 뭐든 산다.
rpg_plus/pickup/stones = 매끈한 돌 몇 개. 쓸모없다, 그러니까 팔 물건이다.
rpg_plus/pickup/mushroom = 단단한 숲 버섯. 먹으면 기운이 날 것이다.

rpg_plus/winter/map/name = 하얀 고개
rpg_plus/winter/enter/title = 하얀 고개
rpg_plus/winter/enter/line = 표지판은 지름길을 약속했다. 동상 이야기는 없었다.
rpg_plus/winter/sign = 동쪽은 사막. 날씨와는 상의하지 않았다.
rpg_plus/winter/chest_reward = 상자에 동전 ${reward}개가 들어 있다.

rpg_plus/barrel/empty = 비었다. 쓰레기까지 가져가 버렸다.
rpg_plus/barrel/found_2_coins_branches = 통 안에 잔돈이 있었다: 동전 2닢, 땔감 묶음 1개.
rpg_plus/barrel/found_2_coins_resin = 통 안에 잔돈이 있었다: 동전 2닢, 수지 1개.
rpg_plus/barrel/found_3_coins_elixir = 통 안에 잔돈이 있었다: 동전 3닢, 엘릭서 1병.
rpg_plus/barrel/found_4_coins_resin = 통 안에 잔돈이 있었다: 동전 4닢, 수지 1개.
rpg_plus/desert/caravan = 대상(隊商)은 떠났다. 가격은 남았다. 그래서 싸진 것은 없다.
rpg_plus/desert/enemy/beetle = 딱정벌레가 모래를 긁고 있다. 통행료로 고기를 받는다.
rpg_plus/desert/enemy/scorpion = 전갈이 꼬리를 든다. 협상은 짧게 끝날 것이다.
rpg_plus/desert/enter = 마지막 나무를 지나면 그늘이 끝난다. 여기 전갈은 이 땅의 희망보다 크다.
rpg_plus/desert/house = 문에 쪽지가 붙어 있다: 「선선해지면 돌아오겠습니다」. 잉크는 바랬다.
rpg_plus/woodland/amber/recovered = 호박 심장은 동굴 옆에 남아 있었다. 이번에는 가져간다.
rpg_plus/woodland/beacon/1 = 빈 요람. 여기에는 전에도 빛을 가져왔다. 그리고 가져갔다.
rpg_plus/woodland/beacon/2 = 수호 등불이 필요하다: 호박, 수지 2, 땔감 묶음 2. 작업대는 마을 우물 옆에 있다.
rpg_plus/woodland/beacon/3 = “빛의 빚: 삼십 년.” 뿌리 아래의 목소리가 종이처럼 바스락거린다. “누가 갚는가?”
rpg_plus/woodland/beacon/4 = 빛을 숲에 돌려준다. 마을은 스스로 빛을 만드는 법을 배우면 된다.
rpg_plus/woodland/beacon/5 = 등불은 마을에 남기고, 공정한 계약을 협상한다.
rpg_plus/woodland/beacon/6 = 먼저 생각해 본다
rpg_plus/woodland/beacon/7 = 등불을 돌 위에 놓고 덧창을 연다. 호박에서 가느다란 뿌리가 돋아난다.
rpg_plus/woodland/beacon/8 = “수락됨.” 잠시 침묵. “영수증은 발급되지 않음.”
rpg_plus/woodland/beacon/9 = “마을에 등불 하나. 대신 옛 길 너머에서는 도끼를 들지 말 것. 그리고 장부는 촌장이 맡지 않는다.”
rpg_plus/woodland/beacon/10 = “합의됨.” 돌 위에 손바닥 자국이 떠오른다. 손가락이 너무 많다. 그래도 너는 손을 얹는다.
rpg_plus/woodland/beacon/11 = 돌아가는 길이 더 쉬워진 것 같다. 더 안전해진 건 아니다. 길이 이제 네 이름을 알 뿐이다.
rpg_plus/woodland/beacon/12 = 등불은 고르게 타오른다. 뿌리 아래의 누군가가 조심스럽게 줄을 지우고 있다.
rpg_plus/woodland/beacon/13 = 돌 위에 어린잎이 돋는다. 장부에 뿌리가 내렸다.
rpg_plus/woodland/courier/1 = “소포는 배달했습니다.” 배달원이 빈 가방을 보여 준다. “수령인은 서명을 거부했습니다. 수령인에게는 뿌리가 있습니다.”
rpg_plus/woodland/courier/2 = 그가 쪽지를 건넨다: “숲은 화난 게 아니다. 세고 있다. 빛을 돌려주거나, 공정하게 값을 치르기 시작하라.”
rpg_plus/woodland/courier/3 = “약초꾼에게 가져가세요. 저는 여기 앉아 있겠습니다. 계약서상 점심은 제 몫이에요. 계약서는 없지만 점심은 나와야 합니다.”
rpg_plus/woodland/courier/4 = “가세요. 저도 뒤따르겠습니다. 먼저 뿌리에 서명해 줄 사람을 찾아야 해서요.”
rpg_plus/woodland/elder/1 = “늑대는 염소를 죽인다. 숲은 등불을 끈다. 장부에는 범인이 한 명 필요하다. 늑대는 이미 기재되어 있다.”
rpg_plus/woodland/elder/2 = 늑대가 등불을 끌 수 있나요?
rpg_plus/woodland/elder/3 = 어디서 찾을 수 있죠?
rpg_plus/woodland/elder/4 = “아니. 하지만 ‘미상’이라고 쓰려면 서류가 세 장 더 필요해.”
rpg_plus/woodland/elder/5 = 촌장이 부서진 등불을 탁자에 올려놓는다. 텅 빈 요람은 주먹만 하다.
rpg_plus/woodland/elder/6 = “전에는 신당에서 호박이 타올랐다. 그러다 우리는 마을에 빛이 더 필요하다고 판단했다. 숲은 생각이 달랐지.”
rpg_plus/woodland/elder/7 = “동쪽, 연못 너머다. 늑대가 동굴을 지키고 있다. 쫓아내라. 호박을 찾으면 팔지 마라. 한 번 이익을 본 적이 있으니까.”
rpg_plus/woodland/elder/8 = “호박을 가졌나? 그럼 숲은 이제 늑대조차 믿지 않는다는 뜻이군.”
rpg_plus/woodland/elder/9 = “우물 옆에 작업대가 있다. 호박, 수지 두 개, 땔감 묶음 두 개면 수호 등불이 된다. 수지는 슬라임이 남기고, 상인도 재고를 갖고 있다.”
rpg_plus/woodland/elder/10 = “그다음엔 동굴을 지나 신당으로 가라. 거기 빛이 할 일이 있다. 무슨 일인지는 묻지 마라.”
rpg_plus/woodland/elder/11 = “마을이 다시 잠든다.” 촌장이 동전 서른다섯 닢을 센다. “이번 달 처음으로, 어둠에 대한 민원이 하나도 없었다.”
rpg_plus/woodland/elder/12 = “적어도 이제는 우리가 얼마나 거두는지 알겠군.”
rpg_plus/woodland/elder/13 = 촌장이 책상 램프를 끈다. 바깥은 점점 밝아진다.
rpg_plus/woodland/elder/14 = “빛세는 폐지한다.” 그가 동전 서른다섯 닢을 센다. “그런 얼굴로 보지 마라. 어둠세를 도입하지도 않는다. 아직은.”
rpg_plus/woodland/elder/15 = “장부 마감. 염소는 살아 있다. 또 다른 고대의 수수께끼를 찾으면, 먼저 누가 관리하는지부터 알아봐라.”
rpg_plus/woodland/elder/ready = “다 만들었나? 그럼 동굴을 지나 신당으로. 빛을 누구에게 줄지 정할 때까지 덧창은 닫아 둬라.”
rpg_plus/woodland/hearth/1 = 화롯가에서는 누구도 영웅적인 행동을 요구하지 않는다. 드문 장소다.
rpg_plus/woodland/herbalist/1 = “낡은 등불에 손을 데었어. 촌장은 평범한 수지라고 했지. 평범한 수지는 물지 않아.”
rpg_plus/woodland/herbalist/2 = “우물 작업대에서 버섯을 슬라임 수지와 섞어. 연고를 가져와. ‘숲’이라는 건 재료 얘기지, 보증은 아니야.”
rpg_plus/woodland/herbalist/3 = “숲 연고가 필요해. 버섯과 수지. 둘 다 없으면 동쪽 집 옆 상인이 동전 받고 줄 거야.”
rpg_plus/woodland/herbalist/4 = 숲 연고를 준다
rpg_plus/woodland/herbalist/5 = 일단 가지고 있는다
rpg_plus/woodland/herbalist/6 = 약초꾼은 이로 뚜껑을 열고 말없이 손에 바른다. 그제야 지갑을 집어 든다.
rpg_plus/woodland/herbalist/7 = “열두 닢이다. 그리고 다른 일이 있어. 배달원이 여분의 심지를 들고 신당으로 갔는데 돌아오지 않았어. 남쪽 숲을 뒤져 봐.”
rpg_plus/woodland/herbalist/8 = “배달원은 아직 숲에 있어. 길 남쪽. 초록색 조끼에, 나쁜 예감이 드는군.”
rpg_plus/woodland/herbalist/9 = 그녀는 쪽지를 두 번 읽는다. 두 번째에는 뒤집어 본다. 뒷면은 비어 있다.
rpg_plus/woodland/herbalist/10 = “‘숲은 화난 게 아니다. 세고 있는 거다.’” 그녀는 쪽지를 주머니에 넣는다. “등불에는 수지 두 개면 충분해. 세 번째는 가져. 배송료야.”
rpg_plus/woodland/herbalist/11 = “손은 나았고, 배달원도 살아 있어. 쉬고 싶으면 우물 옆 화롯가를 써. 처방전은 필요 없어.”
rpg_plus/woodland/lamplighter/1 = “등불을 세는 중이야. 어제는 일곱, 오늘은 여섯. 일곱 번째가 나를 세고 있어.”
rpg_plus/woodland/lamplighter/2 = “새 등불을 세 번 닦았어. 염소를 한 번도 요구하지 않더군. 발전이야.”
rpg_plus/woodland/lamplighter/3 = “숲은 밝아지고, 마을은 어두워졌어. 그래도 빛은 이제 이자를 받지 않아.”
rpg_plus/woodland/shrine/1 = 아치 너머에서 누군가 세고 있다. ‘마을’이라는 말에서 걸려 다시 처음부터 센다.
rpg_plus/woodland/waystone/1 = 돌에 새겨져 있다: “신당으로: 동쪽 동굴을 지날 것. 빛을 가져가지 말 것. 조건을 고치지 말 것.”
rpg_plus/woodland/workbench/1 = 작업대 위에 지시문이 있다: “맛보지 말 것. 냄새 맡지 말 것. 제품이 말을 하면 제작자는 책임지지 않는다.”
