mod_rpg_plus_game_name = RPG Plus
mod_rpg_plus_game_desc = 完成された小さな RPG:クラスを選ぶプロローグ、村と森の謎、クラフト、交易、砂漠、ターン制バトル。データとシナリオのみ。

rpg_plus/map/village = 灰色の森のそばの村
rpg_plus/map/elder_house = 村長の家
rpg_plus/map/forest = 灰色の森
rpg_plus/character/hero = 勇者
rpg_plus/character/slime = スライム
rpg_plus/character/companion = リラ
rpg_plus/character/wolf = 狼
rpg_plus/item/branches/name = 柴
rpg_plus/item/branches/desc = 灰色の森の枯れ枝。ガラクタだが、商人はひと抱えにつき硬貨 1 枚で買ってくれる。
rpg_plus/item/stones/name = 石
rpg_plus/item/stones/desc = 森のすべすべした石。なぜか商人は 1 つ硬貨 2 枚で買い取る。
rpg_plus/item/mushroom/name = 森のキノコ
rpg_plus/item/mushroom/desc = 食べられるキノコ。体力を 5 回復する。
rpg_plus/item/elixir/name = エリクサー
rpg_plus/item/elixir/desc = 村の店で売っている赤い回復のエリクサー。体力を 20 回復する。
rpg_plus/shop/village_merchant = 商人の店

rpg_plus/item/amber/name = 琥珀の心臓
rpg_plus/item/amber/desc = 中で何かが脈打っている。樹脂がそんなことをするはずがない。ランタンの部品。
rpg_plus/item/fur_mantle/name = 森番のマント
rpg_plus/item/fur_mantle/desc = 毛皮と樹脂：防御 +3、体力 +1。どの職業でも身に着けられる。
rpg_plus/item/resin/name = 生きた樹脂
rpg_plus/item/resin/desc = スライムが遺言の代わりに残していった。雨の中でも燃える。
rpg_plus/item/wolf_pelt/name = 銀狼の毛皮
rpg_plus/item/wolf_pelt/desc = 狼は死後も毛が抜ける。温かく、丈夫だ。
rpg_plus/item/salve/name = 森の軟膏
rpg_plus/item/salve/desc = 体力を 18 回復する。スープの匂いがする。スープではない。
rpg_plus/item/ward_lantern/name = 守りのランタン
rpg_plus/item/ward_lantern/desc = 樹脂の揺りかごに収まった琥珀。森の祠へ持って行け。
rpg_plus/quest/ward/name = 帳簿に灯る光
rpg_plus/quest/ward/0 = 西の家にいる村長と話せ。なぜ森が村に迫っているのか突き止めろ。
rpg_plus/quest/ward/1 = 東の森の洞窟のそばにいる狼を始末しろ。琥珀の心臓を見つけろ。
rpg_plus/quest/ward/2 = 井戸のそばの作業台で守りのランタンを作れ：琥珀、樹脂 2、柴 2 束。スライムは樹脂を落とし、商人も売っている。そのあと狼の先の洞窟に入り、祠へ向かえ。
rpg_plus/quest/ward/3 = 狼の先の洞窟に入り、祠へ行け。新しい光が誰に仕えるかを決めろ。
rpg_plus/quest/ward/4 = 報酬を受け取るため村長のもとへ戻れ。森はもうお前の答えを知っている。
rpg_plus/quest/apothecary/name = 外用のスープ
rpg_plus/quest/apothecary/0 = 西の柵のそばの薬草師は、火傷した手の薬が必要だ。話しかけろ。
rpg_plus/quest/apothecary/1 = 森の軟膏を作れ：キノコ＋生きた樹脂。井戸の作業台を使い、そのあと薬草師に届けろ。
rpg_plus/quest/courier/name = 最後の配達
rpg_plus/quest/courier/0 = 灰色の森の南部で行方不明の配達人を探せ。薬草師が彼に小包を渡した。
rpg_plus/quest/courier/1 = 配達人のメモを西の柵のそばの薬草師に届けろ。
rpg_plus/recipe/salve/desc = キノコと樹脂。外用のほうが内服より効く。
rpg_plus/recipe/mantle/desc = 樹脂でなめした銀の毛皮。暖かさと守り。
rpg_plus/recipe/lantern/desc = 琥珀、樹脂 2、柴 2 束。光には枠が要る。
rpg_plus/station/name = 井戸の作業台
rpg_plus/map/shrine = 森は覚えている
rpg_plus/desert/map/name = 乾いた行軍路
rpg_plus/desert/enemy/scorpion/name = 砂サソリ
rpg_plus/desert/enemy/beetle/name = 砂漠の甲虫
