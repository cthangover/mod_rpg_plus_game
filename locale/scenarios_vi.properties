rpg_plus/prologue/title = Ngã ba
rpg_plus/prologue/line1 = Tấm biển thật thà chỉ cùng lúc ba hướng. Hướng nào cũng chẳng muốn đi.
rpg_plus/prologue/line2 = Phía dưới là ngôi làng bên Rừng Xám. Nghe nói ở đó cần một kẻ không sợ sói. Hoặc có sợ, nhưng im lặng. Trong túi leng keng hai mươi lăm đồng xu — tất cả những gì còn lại của kiếp trước.
rpg_plus/prologue/ask = Trước khi tới đây, ngươi là ai?
rpg_plus/prologue/opt_warrior = Một người lính. Kiếm thì đơn giản.
rpg_plus/prologue/opt_mage = Học trò pháp sư. Lửa nghe lời ta.
rpg_plus/prologue/opt_rogue = Kẻ lang thang. Thương lượng được với bất kỳ ai.
rpg_plus/prologue/warrior = Thanh kiếm gỗ sau lưng là tất cả những gì doanh trại để lại cho ngươi. Cùng với thói quen ra đòn trước.
rpg_plus/prologue/mage = Cây gậy ấm, viên pha lê ngân nga. Thầy bảo lửa nghe lời kẻ thông minh. Về những người còn lại, ông chưa kịp nói.
rpg_plus/prologue/rogue = Dao găm trong tay áo, nụ cười luôn sẵn. Cửa mở vì nụ cười. Cửa nào không mở thì có dao găm.
rpg_plus/prologue/seer = Bên tấm biển có một lữ khách khoác áo choàng tím nhạt. Cô nhìn ngươi như thể đã biết kết cục, và thấy chán từ trước.
rpg_plus/prologue/seer_ask = Ngươi sẽ nói gì với cô ấy?
rpg_plus/prologue/opt_ask_way = Lễ phép hỏi đường [Sức hút 10]
rpg_plus/prologue/opt_pass = Lặng lẽ đi qua
rpg_plus/prologue/gift = “Lễ phép. Lạ thật.” Cô ném cho ngươi một lá bùa cỏ bốn lá. “Giữ lấy. Vận may thích kẻ biết hỏi. Không lâu, nhưng thích.”
rpg_plus/prologue/snub = “Tự ngươi sẽ tìm ra,” cô quay đi. “Ai cũng tìm ra. Vài người còn sống sót nữa.”
rpg_plus/prologue/path = Con đường chạy xuống làng. Sương mù tản ra miễn cưỡng, như thể biết ngươi đang đi đâu.
rpg_plus/prologue/mage_hint = Cây gậy khẽ lách tách tia lửa. Nghe nói sói không ưa lửa. Có vẻ cây gậy cũng không ưa sói.
rpg_plus/prologue/sheet_hint = Bảng của ngươi là nút hình quyển sách trên thanh trên cùng: chỉ số, cấp, trang bị. Đồ được mặc từ trong túi.
rpg_plus/yard/intro = “Nào,” sư phụ khoanh tay. “Cho ta xem. Chỉ đừng tự giết mình, ta không chịu trách nhiệm đâu.”
rpg_plus/yard/ask = Làm gì đây?
rpg_plus/yard/opt_drill = Luyện đòn (+20 kinh nghiệm, một lần)
rpg_plus/yard/opt_log = Nâng khúc gỗ qua đầu [Sức mạnh 12]
rpg_plus/yard/opt_back = Quay về làng
rpg_plus/yard/drill_done = “Không tệ. Thêm trăm đòn như thế là trông giống chiến binh rồi. Từ xa.”
rpg_plus/yard/drilled = “Hôm nay thế là đủ. Cơ bắp lớn khi ngủ. Đi ngủ đi.”
rpg_plus/yard/log_ok = “Ha! Nâng được rồi.” Sư phụ ném cho ngươi một lọ. “Thuốc sức mạnh. Khỏi cảm ơn. Và đừng uống lúc bụng đói.”
rpg_plus/yard/log_again = “Lại nữa? Khoe khoang. Hết thuốc rồi. Còn chút nể phục. Chút thôi.”
rpg_plus/yard/log_fail = “Khúc gỗ thắng. Chuyện thường. Lớn thêm chút nữa — hoặc mua thuốc sức mạnh của thương nhân. Nghe nói có tác dụng. Thương nhân nói thế.”
rpg_plus/trainer/hello = “Người mới à? Đưa tay ta xem. À... cũng luyện được. Nếu thật cố gắng.”
rpg_plus/trainer/veteran = “Ngươi rắn rỏi hơn rồi. Cấp ba. Sắp tới định dạy lại ta à. Đừng.”
rpg_plus/trainer/opt_yard = Đến bãi tập
rpg_plus/trainer/opt_later = Để sau
rpg_plus/trainer/bye = “Khi nào tay ngứa ngáy thì quay lại. Bị sói ăn rồi thì khỏi.”
rpg_plus/seer/hello = “Muốn biết điều gì đang chờ ngươi? Đưa tay đây. Không phải tay đó — tay không dùng để trộm ấy.”
rpg_plus/seer/fortune = “Con sói ở hang sợ lửa hơn thép. Và hãy đánh vào chỗ nó không có khiên. Phần này miễn phí. Phần còn lại thì không.”
rpg_plus/seer/charm = “Và kiếm lấy một lá bùa. Vận may không bám vào bàn tay trống. Tay đầy cũng chẳng bám lâu.”
rpg_plus/seer/fog = “Sương mù... Ta chẳng thấy gì. Hoặc ngươi không có tương lai, hoặc hôm nay sao xấu tính. Mai quay lại. Nếu có ngày mai.”
rpg_plus/chest/closed = Rương không khóa. Chủ nhân hoặc cả tin, hoặc chỉ cất hy vọng trong đó.
rpg_plus/chest/coins = Mười đồng xu. Chủ nhân từng cả tin. Từng.
rpg_plus/chest/empty = Trống rỗng. Lòng tin cạn cùng với đồng xu.
rpg_plus/slime/pet = Một con slime thuần. Có người cho nó ăn bằng tay. Tay vẫn còn nguyên.

rpg_plus/chest/house_empty = Trống không. Bạn đã lấy hết rồi.
rpg_plus/chest/forest = Một cái rương trong rừng. Bên trong: nấm khô và niềm hy vọng đã mất của ai đó. Bạn lấy nấm.
rpg_plus/chest/house = Trong rương: tất cũ và một mẩu giấy ghi "Đừng động vào". Muộn rồi. Dưới đống tất: ba đồng xu.
rpg_plus/door/locked = Đã khóa. Sau cánh cửa có ai đó đang rất cố giả vờ là không có ai ở nhà.
rpg_plus/merchant/line1 = "Ồ, có khách! Thuốc tiên mới, hầu như không cặn. Mang cả đồ bỏ đi trong rừng tới đây, tôi mua hết. Ờ, gần như hết."
rpg_plus/slime/line1 = Một con slime chắn lối và kêu ọc ọc đầy thách thức.
rpg_plus/sign/village = "Phía đông: Rừng Xám. Phía tây: cũng là rừng, nhưng chúng ta không đi đến đó."
rpg_plus/villager/line1 = "Người ta bảo trong rừng có slime. Bé thôi, nhưng chui vào ủng thì bực lắm."
rpg_plus/villager/ask = Đi cùng tôi vào rừng không?
rpg_plus/villager/alone = Không, tôi tự lo được.
rpg_plus/villager/join = "Tôi không phải thợ săn, nhưng giày thì chắc. Dẫn đường đi."
rpg_plus/villager/bye = "Vậy thì để slime chờ bạn."
rpg_plus/wolf/line1 = Một con sói ngồi bên hang. Nó nhìn bạn từ đầu đến chân như nhìn đàn dê của trưởng làng.
rpg_plus/wolf/line2 = "Grừ."
rpg_plus/house/enter = Ngôi nhà thoang thoảng mùi thảo mộc, sáp ong và một chút mùi trưởng làng.
rpg_plus/forest/enter = Rừng Xám. Ở đây yên tĩnh theo cái kiểu chỉ có ở nơi ai đó đang bị ăn thịt.
rpg_plus/intro/title = Ngôi làng bên Rừng Xám
rpg_plus/intro/line1 = Buổi sáng. Lũ gà trống đã khản giọng từ trước bình minh, còn trưởng làng đã sai thằng bé đi gọi bạn ba lần.
rpg_plus/intro/controls = Di chuyển bằng WASD hoặc phím mũi tên. Nói chuyện, mở và đọc bằng E hoặc F.
rpg_plus/pickup/branches = Một ôm củi khô. Thương nhân trong làng sẽ nhận, ông ta mua mọi thứ.
rpg_plus/pickup/stones = Vài viên đá nhẵn. Vô dụng, nghĩa là bán được.
rpg_plus/pickup/mushroom = Một cây nấm rừng chắc nịch. Ăn vào sẽ thấy khỏe hơn.

rpg_plus/winter/map/name = Đèo Trắng
rpg_plus/winter/enter/title = Đèo Trắng
rpg_plus/winter/enter/line = Biển chỉ đường hứa có lối tắt. Nó không nhắc đến tê cóng.
rpg_plus/winter/sign = Phía đông: sa mạc. Chưa hỏi ý kiến thời tiết.
rpg_plus/winter/chest_reward = Trong rương có ${reward} đồng xu.

rpg_plus/barrel/empty = Trống rỗng. Ngay cả rác cũng đã bị lấy đi.
rpg_plus/barrel/found_2_coins_branches = Trong thùng có chút tiền lẻ: 2 đồng và 1 bó củi khô.
rpg_plus/barrel/found_2_coins_resin = Trong thùng có chút tiền lẻ: 2 đồng và 1 nhựa.
rpg_plus/barrel/found_3_coins_elixir = Trong thùng có chút tiền lẻ: 3 đồng và 1 thuốc tiên.
rpg_plus/barrel/found_4_coins_resin = Trong thùng có chút tiền lẻ: 4 đồng và 1 nhựa.
rpg_plus/desert/caravan = Đoàn lữ hành đã rời đi. Giá cả vẫn còn. Chẳng có gì rẻ hơn cả.
rpg_plus/desert/enemy/beetle = Con bọ đang cào cát. Nó đòi thịt làm phí qua đường.
rpg_plus/desert/enemy/scorpion = Bọ cạp giơ đuôi lên. Cuộc thương lượng sẽ ngắn thôi.
rpg_plus/desert/enter = Qua khỏi cây cuối cùng, bóng râm kết thúc. Bọ cạp ở đây to hơn cả những hy vọng của vùng này.
rpg_plus/desert/house = Trên cửa có mảnh giấy: «Khi trời mát lại tôi sẽ về». Mực đã phai.
rpg_plus/woodland/amber/recovered = Trái tim hổ phách đã bị bỏ lại bên hang động. Lần này bạn mang theo nó.
rpg_plus/woodland/beacon/1 = Một cái nôi trống. Ánh sáng từng được mang đến đây. Rồi cũng bị mang đi.
rpg_plus/woodland/beacon/2 = Bạn cần một đèn lồng canh giữ: hổ phách, 2 nhựa và 2 bó củi. Bàn làm việc nằm cạnh giếng của làng.
rpg_plus/woodland/beacon/3 = “NỢ ÁNH SÁNG: BA MƯƠI NĂM.” Giọng nói dưới rễ cây xào xạc như giấy. “AI TRẢ?”
rpg_plus/woodland/beacon/4 = Trả ánh sáng lại cho rừng. Để làng học cách tự thắp lấy.
rpg_plus/woodland/beacon/5 = Giữ đèn lồng cho làng và đàm phán một hiệp ước công bằng.
rpg_plus/woodland/beacon/6 = Nghĩ kỹ đã
rpg_plus/woodland/beacon/7 = Bạn đặt đèn lồng lên phiến đá và mở cửa chớp. Từ hổ phách mọc ra những rễ cây mảnh.
rpg_plus/woodland/beacon/8 = “ĐÃ CHẤP NHẬN.” Một khoảng im lặng. “KHÔNG CÓ BIÊN LAI.”
rpg_plus/woodland/beacon/9 = “Một đèn lồng cho làng. Đổi lại, không một chiếc rìu nào được qua con đường cũ. Và trưởng làng không giữ sổ sách.”
rpg_plus/woodland/beacon/10 = “ĐÃ THỎA THUẬN.” Trên phiến đá hiện dấu bàn tay. Quá nhiều ngón. Dù vậy bạn vẫn đặt tay mình lên.
rpg_plus/woodland/beacon/11 = Đường về có vẻ dễ đi hơn. Không phải vì an toàn hơn. Chỉ là con đường giờ đã biết tên bạn.
rpg_plus/woodland/beacon/12 = Đèn lồng cháy đều. Ai đó dưới rễ cây đang cẩn thận gạch bỏ từng dòng.
rpg_plus/woodland/beacon/13 = Trên phiến đá mọc những chiếc lá non. Cuốn sổ đã đâm rễ.
rpg_plus/woodland/courier/1 = “Đã giao bưu kiện.” Người đưa thư cho xem chiếc túi rỗng. “Người nhận không chịu ký. Người nhận có rễ.”
rpg_plus/woodland/courier/2 = Anh ta đưa cho bạn một mảnh giấy: “Khu rừng không giận. Nó đang đếm. Trả lại ánh sáng, hoặc bắt đầu trả tiền một cách công bằng.”
rpg_plus/woodland/courier/3 = “Mang đến cho bà lang. Tôi ngồi đây. Hợp đồng ghi tôi được ăn trưa. Hợp đồng thì tôi không có, nhưng bữa trưa vẫn phải có.”
rpg_plus/woodland/courier/4 = “Đi đi. Tôi theo sau. Trước hết tôi phải tìm ai đó để trình cái rễ này.”
rpg_plus/woodland/elder/1 = “Sói giết dê. Rừng tắt đèn. Sổ sách đòi phải có một thủ phạm. Con sói đã được ghi tên rồi.”
rpg_plus/woodland/elder/2 = Sói có thể tắt đèn được không?
rpg_plus/woodland/elder/3 = Tôi tìm nó ở đâu?
rpg_plus/woodland/elder/4 = “Không. Nhưng viết ‘không rõ’ thì phải thêm ba tờ đơn nữa.”
rpg_plus/woodland/elder/5 = Trưởng làng đặt lên bàn một chiếc đèn lồng vỡ. Cái nôi trống bên trong to bằng nắm tay.
rpg_plus/woodland/elder/6 = “Ngày xưa hổ phách từng cháy trong đền thờ. Rồi chúng ta quyết định làng cần ánh sáng hơn. Khu rừng không đồng ý.”
rpg_plus/woodland/elder/7 = “Về phía đông, qua ao. Con sói canh giữ hang động. Xua nó đi. Nếu tìm thấy hổ phách thì đừng bán. Chúng ta đã kiếm lời từ nó một lần rồi.”
rpg_plus/woodland/elder/8 = “Có hổ phách trong tay rồi à? Vậy là rừng không còn tin cả lũ sói nữa.”
rpg_plus/woodland/elder/9 = “Có một bàn làm việc bên giếng. Hổ phách, 2 nhựa và 2 bó củi sẽ thành đèn lồng canh giữ. Slime để lại nhựa; thương nhân cũng có hàng.”
rpg_plus/woodland/elder/10 = “Rồi qua hang động đến đền thờ. Ở đó ánh sáng có việc để làm. Đừng hỏi tôi là việc gì.”
rpg_plus/woodland/elder/11 = “Làng lại đi ngủ.” Trưởng làng đếm ra ba mươi lăm đồng. “Lần đầu tiên trong tháng này, không ai khiếu nại về bóng tối.”
rpg_plus/woodland/elder/12 = “Ít ra giờ chúng ta sẽ biết mình lấy bao nhiêu.”
rpg_plus/woodland/elder/13 = Trưởng làng tắt chiếc đèn bàn. Bên ngoài, ánh sáng mỗi lúc một tăng.
rpg_plus/woodland/elder/14 = “Thuế ánh sáng đã bãi bỏ.” Ông đếm ra ba mươi lăm đồng. “Đừng nhìn tôi như thế. Tôi cũng không đặt thuế bóng tối. Chưa đâu.”
rpg_plus/woodland/elder/15 = “Sổ sách đã khép. Dê còn sống. Nếu tìm thấy một bí ẩn cổ xưa khác, trước hết hãy hỏi ai đang giữ nó.”
rpg_plus/woodland/elder/ready = “Làm xong rồi à? Vậy qua hang động đến đền thờ. Đừng mở cửa chớp cho đến khi quyết định ánh sáng sẽ phục vụ ai.”
rpg_plus/woodland/hearth/1 = Bên bếp lửa không ai đòi bạn một việc anh hùng. Một nơi hiếm có.
rpg_plus/woodland/herbalist/1 = “Tay tôi bị bỏng vì cái đèn cũ. Trưởng làng bảo đó chỉ là nhựa thường. Nhựa thường thì không cắn.”
rpg_plus/woodland/herbalist/2 = “Trộn nấm với nhựa slime tại bàn làm việc bên giếng. Mang thuốc mỡ đến cho tôi. ‘Rừng’ là nói về nguyên liệu, không phải bảo đảm đâu.”
rpg_plus/woodland/herbalist/3 = “Cần thuốc mỡ rừng. Nấm và nhựa. Nếu không có thì thương nhân bên ngôi nhà phía đông sẽ giúp, đổi bằng tiền.”
rpg_plus/woodland/herbalist/4 = Đưa bà lang thuốc mỡ rừng
rpg_plus/woodland/herbalist/5 = Giữ lại đã
rpg_plus/woodland/herbalist/6 = Bà lang cắn nắp lọ mở ra và lặng lẽ xoa lên tay. Chỉ sau đó bà mới với lấy túi tiền.
rpg_plus/woodland/herbalist/7 = “Mười hai đồng. Và một việc khác: người đưa thư mang theo một bấc đèn dự phòng lên đền thờ, rồi không quay về. Tìm ở phía nam khu rừng.”
rpg_plus/woodland/herbalist/8 = “Người đưa thư vẫn còn trong rừng. Phía nam con đường. Áo gilê xanh, và tôi có linh cảm không lành.”
rpg_plus/woodland/herbalist/9 = Bà đọc mảnh giấy hai lần. Lần thứ hai thì lật lại. Mặt sau không có gì.
rpg_plus/woodland/herbalist/10 = “‘Khu rừng không giận. Nó đang đếm.’” Bà cất mảnh giấy đi. “Làm đèn chỉ cần hai nhựa. Cái thứ ba cậu giữ lấy. Phí giao hàng.”
rpg_plus/woodland/herbalist/11 = “Tay đã lành. Người đưa thư còn sống. Nếu cần nghỉ thì dùng bếp lửa bên giếng. Không cần đơn thuốc.”
rpg_plus/woodland/lamplighter/1 = “Đang đếm đèn. Hôm qua bảy cái. Hôm nay sáu cái. Cái thứ bảy đang đếm tôi.”
rpg_plus/woodland/lamplighter/2 = “Đã lau cái đèn mới ba lần. Nó chưa bao giờ đòi con dê nào. Tiến bộ đấy.”
rpg_plus/woodland/lamplighter/3 = “Rừng sáng hơn. Làng tối hơn. Ít ra ánh sáng giờ không tính lãi nữa.”
rpg_plus/woodland/shrine/1 = Phía sau vòm cổng có ai đó đang đếm. Vấp ở chữ “làng” rồi lại đếm từ đầu.
rpg_plus/woodland/waystone/1 = Trên phiến đá có khắc: “Đến đền thờ: qua hang động phía đông. Không được mang ánh sáng đi. Không được sửa điều khoản.”
rpg_plus/woodland/workbench/1 = Trên bàn làm việc có hướng dẫn: “Đừng nếm. Đừng ngửi. Nếu sản phẩm lên tiếng, người chế tạo không chịu trách nhiệm.”
