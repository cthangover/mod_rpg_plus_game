mod_rpg_plus_game_name = RPG Plus
mod_rpg_plus_game_desc = 완성된 소규모 RPG: 클래스를 고르는 프롤로그, 마을과 숲의 미스터리, 제작, 거래, 사막, 턴제 전투. 데이터와 시나리오만 있습니다.

rpg_plus/map/village = 잿빛 숲 옆 마을
rpg_plus/map/elder_house = 촌장의 집
rpg_plus/map/forest = 잿빛 숲
rpg_plus/character/hero = 영웅
rpg_plus/character/slime = 슬라임
rpg_plus/character/companion = 리라
rpg_plus/character/wolf = 늑대
rpg_plus/item/branches/name = 땔감
rpg_plus/item/branches/desc = 잿빛 숲의 마른 나뭇가지. 잡동사니지만 상인이 한 아름에 동전 하나를 쳐 준다.
rpg_plus/item/stones/name = 돌
rpg_plus/item/stones/desc = 숲의 매끈한 돌. 어째서인지 상인은 하나에 동전 두 닢에 사들인다.
rpg_plus/item/mushroom/name = 숲 버섯
rpg_plus/item/mushroom/desc = 먹을 수 있는 버섯. 체력을 5 회복한다.
rpg_plus/item/elixir/name = 엘릭서
rpg_plus/item/elixir/desc = 마을 상점에서 파는 붉은 치유 엘릭서. 체력을 20 회복한다.
rpg_plus/shop/village_merchant = 상인의 가게

rpg_plus/item/amber/name = 호박 심장
rpg_plus/item/amber/desc = 안에서 무언가가 뛰고 있다. 수지가 그럴 리 없다. 등불의 부품.
rpg_plus/item/fur_mantle/name = 숲지기의 망토
rpg_plus/item/fur_mantle/desc = 털가죽과 수지: 방어 +3, 체력 +1. 어떤 직업이든 입을 수 있다.
rpg_plus/item/resin/name = 살아 있는 수지
rpg_plus/item/resin/desc = 슬라임이 유언 대신 남기고 갔다. 비 속에서도 탄다.
rpg_plus/item/wolf_pelt/name = 은빛 늑대 털가죽
rpg_plus/item/wolf_pelt/desc = 늑대는 죽은 뒤에도 털이 빠진다. 따뜻하고 질기다.
rpg_plus/item/salve/name = 숲 연고
rpg_plus/item/salve/desc = 체력을 18 회복한다. 수프 냄새가 난다. 수프가 아니다.
rpg_plus/item/ward_lantern/name = 수호 등불
rpg_plus/item/ward_lantern/desc = 수지 요람에 든 호박. 숲의 신당으로 가져가라.
rpg_plus/quest/ward/name = 장부 위의 빛
rpg_plus/quest/ward/0 = 서쪽 집의 촌장에게 말을 걸어라. 왜 숲이 마을을 조여 오는지 알아내라.
rpg_plus/quest/ward/1 = 동쪽 숲 동굴 옆의 늑대를 처치하라. 호박 심장을 찾아라.
rpg_plus/quest/ward/2 = 우물 옆 작업대에서 수호 등불을 만들어라: 호박, 수지 2, 땔감 묶음 2. 슬라임은 수지를 떨어뜨리고, 상인도 판다. 그다음 늑대 너머의 동굴로 들어가 신당에 닿아라.
rpg_plus/quest/ward/3 = 늑대 너머의 동굴로 들어가 신당에 닿아라. 새 빛이 누구를 섬길지 정하라.
rpg_plus/quest/ward/4 = 보수를 받으러 촌장에게 돌아가라. 숲은 이미 너의 대답을 알고 있다.
rpg_plus/quest/apothecary/name = 외용 수프
rpg_plus/quest/apothecary/0 = 서쪽 울타리 옆의 약초꾼이 화상 입은 손에 쓸 약을 찾고 있다. 그녀에게 말을 걸어라.
rpg_plus/quest/apothecary/1 = 숲 연고를 만들어라: 버섯 + 살아 있는 수지. 우물 작업대를 쓴 뒤 약초꾼에게 가져다줘라.
rpg_plus/quest/courier/name = 마지막 배달
rpg_plus/quest/courier/0 = 잿빛 숲 남쪽에서 실종된 배달원을 찾아라. 약초꾼이 그에게 소포를 맡겼다.
rpg_plus/quest/courier/1 = 배달원의 쪽지를 서쪽 울타리 옆의 약초꾼에게 가져가라.
rpg_plus/recipe/salve/desc = 버섯과 수지. 안에 쓰는 것보다 바르는 게 더 잘 듣는다.
rpg_plus/recipe/mantle/desc = 수지로 무두질한 은빛 가죽. 따뜻함과 보호.
rpg_plus/recipe/lantern/desc = 호박, 수지 2, 땔감 묶음 2. 빛에는 틀이 필요하다.
rpg_plus/station/name = 우물 작업대
rpg_plus/map/shrine = 숲은 기억한다
rpg_plus/desert/map/name = 마른 행군길
rpg_plus/desert/enemy/scorpion/name = 모래 전갈
rpg_plus/desert/enemy/beetle/name = 사막 딱정벌레
