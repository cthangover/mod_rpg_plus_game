rpg_plus/prologue/title = El cruce
rpg_plus/prologue/line1 = El poste señala con honradez tres caminos a la vez. Ninguno apetece.
rpg_plus/prologue/line2 = Abajo está la aldea junto al Bosque Gris. Dicen que necesita a alguien que no tema a los lobos. O que los tema, pero en silencio. En la bolsa tintinean veinticinco monedas: todo lo que queda de tu vida anterior.
rpg_plus/prologue/ask = ¿Quién eras antes de llegar aquí?
rpg_plus/prologue/opt_warrior = Un soldado. Una espada es sencilla.
rpg_plus/prologue/opt_mage = Aprendiz de mago. El fuego me escucha.
rpg_plus/prologue/opt_rogue = Un vagabundo. Con cualquiera se llega a un trato.
rpg_plus/prologue/warrior = La espada de madera a la espalda es todo lo que te dejó el cuartel. Eso y la costumbre de golpear primero.
rpg_plus/prologue/mage = El bastón está tibio y el cristal zumba. Tu maestro decía que el fuego obedece a los listos. Del resto no llegó a hablar.
rpg_plus/prologue/rogue = Una daga en la manga y una sonrisa a punto. Las puertas se abren con la sonrisa. Las que no, con la daga.
rpg_plus/prologue/seer = Junto al poste se sienta una caminante de capa lila. Te mira como si ya supiera cómo acaba todo, y le aburriera.
rpg_plus/prologue/seer_ask = ¿Qué le dirás?
rpg_plus/prologue/opt_ask_way = Preguntar el camino con cortesía [Carisma 10]
rpg_plus/prologue/opt_pass = Pasar de largo en silencio
rpg_plus/prologue/gift = —Educado. Mira tú. —Te lanza un amuleto de trébol—. Quédatelo. La suerte quiere a quien pregunta. Poco tiempo, pero quiere.
rpg_plus/prologue/snub = —Ya lo encontrarás —se da la vuelta—. Todos lo encuentran. Algunos, incluso vivos.
rpg_plus/prologue/path = El sendero baja hacia la aldea. La niebla se abre a regañadientes, como si supiera adónde vas.
rpg_plus/prologue/mage_hint = El bastón chasquea una chispa. Dicen que a los lobos no les gusta el fuego. Al bastón, al parecer, no le gustan los lobos.
rpg_plus/prologue/sheet_hint = Tu hoja es el botón del libro en la barra superior: estadísticas, nivel, equipo. El equipo se pone desde la bolsa.
rpg_plus/yard/intro = —Bueno —el maestro se cruza de brazos—. Enséñame. Solo no te mates, que no respondo por ti.
rpg_plus/yard/ask = ¿Qué hacemos?
rpg_plus/yard/opt_drill = Practicar golpes (+20 de experiencia, una vez)
rpg_plus/yard/opt_log = Levantar el tronco sobre la cabeza [Fuerza 12]
rpg_plus/yard/opt_back = Volver a la aldea
rpg_plus/yard/drill_done = —No está mal. Cien más como esos y pasarás por luchador. De lejos.
rpg_plus/yard/drilled = —Basta por hoy. Los músculos crecen mientras duermes. Vete a dormir.
rpg_plus/yard/log_ok = —¡Ja! Lo levantaste. —El maestro te lanza un frasco—. Tónico de fuerza. No me des las gracias. Y no lo bebas en ayunas.
rpg_plus/yard/log_again = —¿Otra vez? Fanfarrón. No hay más tónico. Hay respeto. Un poco.
rpg_plus/yard/log_fail = —Ganó el tronco. Pasa. Crece un poco… o cómprale un tónico de fuerza al mercader. Dicen que ayuda. Lo dice el mercader.
rpg_plus/trainer/hello = —¿Nuevo? Enséñame las manos. Ajá... con esto se puede trabajar. Si uno se empeña.
rpg_plus/trainer/veteran = —Te has curtido. Nivel tres. Pronto querrás enseñarme a mí. Ni se te ocurra.
rpg_plus/trainer/opt_yard = Ir al patio de entrenamiento
rpg_plus/trainer/opt_later = Ahora no
rpg_plus/trainer/bye = —Vuelve cuando te piquen las manos. Si te come el lobo, no hace falta.
rpg_plus/seer/hello = —¿Quieres saber qué te espera? Dame la mano. Esa no: la que no usas para robar.
rpg_plus/seer/fortune = —El lobo de la cueva teme más al fuego que al acero. Y golpea donde no tenga escudo. Esto es gratis. Lo demás, no.
rpg_plus/seer/charm = —Y búscate un amuleto. La suerte no se agarra a manos vacías. A las llenas tampoco por mucho tiempo.
rpg_plus/seer/fog = —Niebla... No veo nada. O no tienes futuro, o las estrellas están de malas. Vuelve mañana. Si hay mañana.
rpg_plus/chest/closed = El cofre no está cerrado. Su dueño o es confiado o solo guarda esperanzas en él.
rpg_plus/chest/coins = Diez monedas. El dueño era confiado. Era.
rpg_plus/chest/empty = Vacío. La confianza se acabó con las monedas.
rpg_plus/slime/pet = Un slime domesticado. Alguien le da de comer en la mano. Las manos siguen enteras.

rpg_plus/chest/house_empty = Vacío. Ya te lo llevaste todo.
rpg_plus/chest/forest = Un cofre en el bosque. Dentro: setas secas y la esperanza perdida de alguien. Te llevas las setas.
rpg_plus/chest/house = En el cofre: calcetines viejos y una nota que dice "No tocar". Demasiado tarde. Debajo de los calcetines: tres monedas.
rpg_plus/door/locked = Cerrado. Tras la puerta alguien se esfuerza mucho en fingir que no hay nadie en casa.
rpg_plus/merchant/line1 = "¡Oh, un cliente! Elixires frescos, casi sin poso. Y tráeme la basura del bosque, lo compro todo. Bueno, casi."
rpg_plus/slime/line1 = Un limo bloquea el sendero y gorgotea desafiante.
rpg_plus/sign/village = "Al este: el Bosque Gris. Al oeste: también un bosque, pero allí no vamos."
rpg_plus/villager/line1 = "Dicen que en el bosque hay limos. Pequeños, pero fastidia cuando se te meten en la bota."
rpg_plus/villager/ask = ¿Vienes conmigo al bosque?
rpg_plus/villager/alone = No, me las arreglo solo.
rpg_plus/villager/join = "No soy guardabosques, pero mis botas aguantan. Guía."
rpg_plus/villager/bye = "Entonces que te esperen los limos."
rpg_plus/wolf/line1 = Un lobo está sentado junto a la cueva. Te mira igual que mira a las cabras del anciano.
rpg_plus/wolf/line2 = "Grrr."
rpg_plus/house/enter = La casa huele a hierbas, a cera y, un poco, al anciano.
rpg_plus/forest/enter = El Bosque Gris. Está en silencio, como solo lo está donde se están comiendo a alguien.
rpg_plus/intro/title = La aldea junto al Bosque Gris
rpg_plus/intro/line1 = Mañana. Los gallos se quedaron roncos antes del alba, y el anciano ya ha mandado tres veces al chico a buscarte.
rpg_plus/intro/controls = Camina con WASD o las flechas. Habla, abre y lee con E o F.
rpg_plus/pickup/branches = Una brazada de leña seca. El mercader de la aldea la aceptará: él lo compra todo.
rpg_plus/pickup/stones = Un par de piedras lisas. No sirven para nada, así que se pueden vender.
rpg_plus/pickup/mushroom = Una seta firme del bosque. Cómetela y te sentirás mejor.

rpg_plus/winter/map/name = Paso Blanco
rpg_plus/winter/enter/title = Paso Blanco
rpg_plus/winter/enter/line = La señal prometía un atajo. No decía nada de congelarse.
rpg_plus/winter/sign = Al este: el desierto. No consultaron al tiempo.
rpg_plus/winter/chest_reward = El cofre contiene ${reward} monedas.

rpg_plus/barrel/empty = Vacío. Hasta la basura se han llevado.
rpg_plus/barrel/found_2_coins_branches = En el barril hay algo de cambio: 2 monedas y 1 haz de leña.
rpg_plus/barrel/found_2_coins_resin = En el barril hay algo de cambio: 2 monedas y 1 resina.
rpg_plus/barrel/found_3_coins_elixir = En el barril hay algo de cambio: 3 monedas y 1 elixir.
rpg_plus/barrel/found_4_coins_resin = En el barril hay algo de cambio: 4 monedas y 1 resina.
rpg_plus/desert/caravan = La caravana se ha ido. Los precios se quedaron. Nada se ha abaratado.
rpg_plus/desert/enemy/beetle = El escarabajo raspa la arena. Cobra carne por el paso.
rpg_plus/desert/enemy/scorpion = El escorpión levanta la cola. Las negociaciones serán breves.
rpg_plus/desert/enter = Pasado el último árbol se acaba la sombra. Los escorpiones de aquí son más grandes que las esperanzas locales.
rpg_plus/desert/house = En la puerta hay una nota: «Vuelvo cuando refresque». La tinta se ha desvanecido.
rpg_plus/woodland/amber/recovered = El corazón de ámbar quedó junto a la cueva. Esta vez te lo llevas.
rpg_plus/woodland/beacon/1 = Un nido vacío. Aquí ya trajeron luz. Y se la llevaron.
rpg_plus/woodland/beacon/2 = Necesitas un farol de guardia: ámbar, dos resinas y dos haces de leña. El banco de trabajo está junto al pozo de la aldea.
rpg_plus/woodland/beacon/3 = — DEUDA DE LUZ: TREINTA AÑOS. — La voz bajo las raíces cruje como papel. — ¿QUIÉN PAGA?
rpg_plus/woodland/beacon/4 = Devolver la luz al bosque. Que la aldea aprenda a encender la suya.
rpg_plus/woodland/beacon/5 = Quedarse con el farol para la aldea y negociar un pacto justo.
rpg_plus/woodland/beacon/6 = Pensarlo antes
rpg_plus/woodland/beacon/7 = Pones el farol sobre la piedra y abres sus postigos. Del ámbar brotan finas raíces.
rpg_plus/woodland/beacon/8 = — ACEPTADO. — Pausa. — NO SE EXPIDE RECIBO.
rpg_plus/woodland/beacon/9 = — Un farol para la aldea. A cambio, ni un hacha más allá del viejo sendero. Y el anciano no lleva las cuentas.
rpg_plus/woodland/beacon/10 = — ACORDADO. — En la piedra aparece una huella de mano. Tiene demasiados dedos. Pones la tuya encima de todos modos.
rpg_plus/woodland/beacon/11 = El camino de vuelta se hace más fácil. No más seguro. Es que ahora la senda conoce tu nombre.
rpg_plus/woodland/beacon/12 = El farol arde con luz firme. Alguien bajo las raíces tacha con cuidado unas líneas.
rpg_plus/woodland/beacon/13 = En la piedra brotan hojas nuevas. El registro ha echado raíces.
rpg_plus/woodland/courier/1 = — Entregué el paquete. — El mensajero enseña su bolsa vacía. — El destinatario no quiso firmar. Tiene raíces.
rpg_plus/woodland/courier/2 = Te tiende una nota: «El bosque no está enfadado. Está contando. Devuelvan la luz o empiecen a pagar con justicia».
rpg_plus/woodland/courier/3 = — Llévasela a la herborista. Yo me quedo aquí sentado. El contrato dice que me corresponde el almuerzo. El contrato no lo tengo, pero el almuerzo me toca igual.
rpg_plus/woodland/courier/4 = — Anda, ve. Te sigo. Primero tengo que encontrar a quién presentarle las raíces.
rpg_plus/woodland/elder/1 = — El lobo mata cabras. El bosque apaga faroles. El registro exige un culpable. El lobo ya está anotado.
rpg_plus/woodland/elder/2 = ¿Un lobo puede apagar faroles?
rpg_plus/woodland/elder/3 = ¿Dónde lo encuentro?
rpg_plus/woodland/elder/4 = — No. Pero escribir «desconocido» son tres formularios más.
rpg_plus/woodland/elder/5 = El anciano deja sobre la mesa un farol roto. Su nido vacío es del tamaño de un puño.
rpg_plus/woodland/elder/6 = — Antes el ámbar ardía en el santuario. Luego decidimos que la aldea necesitaba más la luz. El bosque no estuvo de acuerdo.
rpg_plus/woodland/elder/7 = — Al este, pasado el estanque. El lobo guarda la cueva. Ahuyéntalo. Si encuentras ámbar, no lo vendas. Ya nos hemos lucrado con él una vez.
rpg_plus/woodland/elder/8 = — ¿Tienes el ámbar? Entonces el bosque ya no confía ni en los lobos.
rpg_plus/woodland/elder/9 = — Hay un banco de trabajo junto al pozo. Ámbar, dos resinas y dos haces de leña hacen un farol de guardia. Los limos dejan resina; el mercader también tiene existencias.
rpg_plus/woodland/elder/10 = — Luego, por la cueva hasta el santuario. Allí hay trabajo para la luz. Solo no me preguntes cuál.
rpg_plus/woodland/elder/11 = — La aldea vuelve a dormir. — El anciano cuenta treinta y cinco monedas. — Por primera vez este mes, nadie ha puesto una queja por la oscuridad.
rpg_plus/woodland/elder/12 = — Al menos ahora sabremos cuánto cobramos.
rpg_plus/woodland/elder/13 = El anciano apaga la lámpara de su mesa. Fuera, la luz crece.
rpg_plus/woodland/elder/14 = — Queda abolido el impuesto a la luz. — Cuenta treinta y cinco monedas. — No me mires así. Tampoco voy a introducir un impuesto a la oscuridad. Todavía no.
rpg_plus/woodland/elder/15 = — Registro cerrado. Cabras vivas. Si encuentras otro misterio antiguo, primero averigua quién se encarga de él.
rpg_plus/woodland/elder/ready = — ¿Ya lo tienes montado? Entonces, por la cueva hasta el santuario. Y no abras los postigos hasta que decidas a quién alumbra la luz.
rpg_plus/woodland/hearth/1 = Nadie junto al hogar exige una hazaña heroica. Un lugar raro.
rpg_plus/woodland/herbalist/1 = — Me quemé las manos con el farol viejo. El anciano dijo que era resina corriente. La resina corriente no muerde.
rpg_plus/woodland/herbalist/2 = — Mezcla una seta con resina de limo en el banco del pozo. Tráeme el ungüento. «Del bosque» describe los ingredientes, no la garantía.
rpg_plus/woodland/herbalist/3 = — Hace falta ungüento del bosque. Seta y resina. Si no tienes nada de eso, el mercader junto a la casa del este te ayudará por unas monedas.
rpg_plus/woodland/herbalist/4 = Darle el ungüento del bosque
rpg_plus/woodland/herbalist/5 = Quedárselo por ahora
rpg_plus/woodland/herbalist/6 = La herborista destapa el bote con los dientes y se unta las manos en silencio. Solo entonces saca la bolsa.
rpg_plus/woodland/herbalist/7 = — Doce monedas. Y otro trabajo: un mensajero se llevó al santuario una mecha de repuesto. No ha vuelto. Busca en el sur del bosque.
rpg_plus/woodland/herbalist/8 = — El mensajero sigue en el bosque. Al sur del camino. Chaleco verde, mal presentimiento.
rpg_plus/woodland/herbalist/9 = Lee la nota dos veces. La segunda vez le da la vuelta. Por detrás no hay nada.
rpg_plus/woodland/herbalist/10 = — «El bosque no está enfadado. Está contando». — Se guarda el papel. — Para el farol bastan dos resinas. La tercera quédatela. Por el envío.
rpg_plus/woodland/herbalist/11 = — Manos curadas. Mensajero vivo. Si necesitas descansar, usa el hogar junto al pozo. Sin receta.
rpg_plus/woodland/lamplighter/1 = — Cuento faroles. Ayer siete. Hoy seis. El séptimo me cuenta a mí.
rpg_plus/woodland/lamplighter/2 = — He pulido el farol nuevo tres veces. Ni una sola vez exigió una cabra. Progreso.
rpg_plus/woodland/lamplighter/3 = — En el bosque hay más luz. En la aldea, menos. Al menos la luz ya no cobra intereses.
rpg_plus/woodland/shrine/1 = Tras el arco, alguien lleva la cuenta. Al llegar a «aldea» se equivoca y vuelve a empezar.
rpg_plus/woodland/waystone/1 = En la piedra está grabado: «Al santuario: por la cueva del este. No sacar la luz. No modificar las condiciones».
rpg_plus/woodland/workbench/1 = En el banco hay una instrucción: «No probar. No oler. Si el producto habla, el fabricante no responde».
