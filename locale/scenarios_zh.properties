rpg_plus/prologue/title = 十字路口
rpg_plus/prologue/line1 = 路标老老实实地同时指向三个方向。哪一边都不想去。
rpg_plus/prologue/line2 = 下面是灰森林边的村子。听说那里需要一个不怕狼的人。或者怕，但别出声。钱袋里叮当响着二十五枚硬币——前半生剩下的全部。
rpg_plus/prologue/ask = 来这里之前，你是什么人？
rpg_plus/prologue/opt_warrior = 当兵的。剑很简单。
rpg_plus/prologue/opt_mage = 法师的学徒。火会听我的。
rpg_plus/prologue/opt_rogue = 流浪汉。跟谁都能谈成。
rpg_plus/prologue/warrior = 背上的木剑是军营留给你的全部。还有先动手的习惯。
rpg_plus/prologue/mage = 法杖温热，水晶嗡鸣。老师说过，火只听聪明人的话。至于其他人——他没来得及讲。
rpg_plus/prologue/rogue = 袖里藏刀，笑容随时奉上。门会为笑容打开。打不开的——就交给刀。
rpg_plus/prologue/seer = 路标旁坐着一位披淡紫斗篷的行者。她看你的样子，像是早知道结局，而且提前觉得无聊。
rpg_plus/prologue/seer_ask = 你要对她说什么？
rpg_plus/prologue/opt_ask_way = 客气地问路［魅力 10］
rpg_plus/prologue/opt_pass = 默默走过
rpg_plus/prologue/gift = “有礼貌。真稀奇。”她把一枚四叶草护符扔给你。“拿着。运气喜欢肯开口的人。喜欢得不久，但喜欢。”
rpg_plus/prologue/snub = “你自己会找到的，”她转过身去，“谁都找得到。有些人甚至是活着找到的。”
rpg_plus/prologue/path = 小路奔向村子。雾气不情不愿地散开，好像知道你要去哪儿。
rpg_plus/prologue/mage_hint = 法杖轻轻噼啪一声迸出火星。据说狼不喜欢火。看来法杖也不喜欢狼。
rpg_plus/prologue/sheet_hint = 你的角色面板是顶部栏上的书本按钮：属性、等级、装备。装备从背包里穿上。
rpg_plus/yard/intro = “好了，”师父抱起双臂，“露一手吧。别把自己弄死就行，我可不负责。”
rpg_plus/yard/ask = 做点什么？
rpg_plus/yard/opt_drill = 练习招式（+20 经验，仅一次）
rpg_plus/yard/opt_log = 把木头举过头顶［力量 12］
rpg_plus/yard/opt_back = 回村子
rpg_plus/yard/drill_done = “不赖。再练一百下，就能冒充战士了。远远地看的话。”
rpg_plus/yard/drilled = “今天够了。肌肉是睡觉时长的。去睡吧。”
rpg_plus/yard/log_ok = “哈！举起来了。”师父丢给你一个小瓶。“力量药剂。别道谢。也别空腹喝。”
rpg_plus/yard/log_again = “又来？爱显摆。药剂没了。有点尊重。一点点。”
rpg_plus/yard/log_fail = “木头赢了。常有的事。再长长——或者找商人买瓶力量药剂。听说有用。商人说的。”
rpg_plus/trainer/hello = “新来的？手伸出来。嗯……还能练。要是下狠心的话。”
rpg_plus/trainer/veteran = “你结实了。三级了。快要轮到你来教我了。别。”
rpg_plus/trainer/opt_yard = 去练武场
rpg_plus/trainer/opt_later = 现在不行
rpg_plus/trainer/bye = “手痒了再来。要是被狼吃了，就不用来了。”
rpg_plus/seer/hello = “想知道等着你的是什么？把手给我。不是这只——是你不用来偷东西的那只。”
rpg_plus/seer/fortune = “洞口的狼怕火胜过怕钢。还有，往它没护盾的地方打。这些免费。其余的不免费。”
rpg_plus/seer/charm = “再给自己找个护符。运气不会黏着空手。满手的也黏不久。”
rpg_plus/seer/fog = “雾……什么也看不见。要么你没有未来，要么今天星星心情不好。明天再来。如果有明天的话。”
rpg_plus/chest/closed = 箱子没上锁。主人要么很信任别人，要么里面只放着希望。
rpg_plus/chest/coins = 十枚硬币。主人曾经很信任别人。曾经。
rpg_plus/chest/empty = 空的。信任和硬币一起用完了。
rpg_plus/slime/pet = 一只驯服的史莱姆。有人用手喂它。手暂时还在。

rpg_plus/chest/house_empty = 空的。你已经全拿走了。
rpg_plus/chest/forest = 森林里的一个箱子。里面有干蘑菇和某人失落的希望。你拿走了蘑菇。
rpg_plus/chest/house = 箱子里：旧袜子和一张写着"别碰"的纸条。太迟了。袜子下面有三枚硬币。
rpg_plus/door/locked = 锁着。门后有人正拼命假装家里没人。
rpg_plus/merchant/line1 = "哦，来客人了！药剂新鲜，几乎没有沉淀。把森林里的破烂也带来，我全收。嗯，差不多全收。"
rpg_plus/slime/line1 = 一只史莱姆挡住了小路，挑衅地咕嘟作响。
rpg_plus/sign/village = "东边：灰森林。西边：也是森林，但我们不去那儿。"
rpg_plus/villager/line1 = "听说森林里有史莱姆。个头不大，可钻进靴子里可真气人。"
rpg_plus/villager/ask = 要和我一起去森林吗？
rpg_plus/villager/alone = 不了，我自己能行。
rpg_plus/villager/join = 「我不是猎人，但鞋子结实。带路吧。」
rpg_plus/villager/bye = 「那就让史莱姆等你吧。」
rpg_plus/wolf/line1 = 一只狼坐在洞穴旁。它打量你的眼神，就像打量村长的山羊。
rpg_plus/wolf/line2 = "嗷呜——"
rpg_plus/house/enter = 屋里有草药、蜡烛的味道，还有一点村长的味道。
rpg_plus/forest/enter = 灰森林。这里安静得只有正在吃掉某人的地方才会这样安静。
rpg_plus/intro/title = 灰森林旁的村庄
rpg_plus/intro/line1 = 早晨。公鸡在天亮前就叫哑了，村长已经派那个男孩来找你三次了。
rpg_plus/intro/controls = 用 WASD 或方向键行走。用 E 或 F 交谈、打开和阅读。
rpg_plus/pickup/branches = 一捆干柴。村里的商人会收的，他什么都收。
rpg_plus/pickup/stones = 几块光滑的石头。毫无用处，所以拿去卖。
rpg_plus/pickup/mushroom = 一朵结实的森林蘑菇。吃下去会舒服些。

rpg_plus/winter/map/name = 白色山口
rpg_plus/winter/enter/title = 白色山口
rpg_plus/winter/enter/line = 路牌承诺有捷径，却没提冻伤。
rpg_plus/winter/sign = 东边是沙漠。看来没征求天气的意见。
rpg_plus/winter/chest_reward = 箱子里有 ${reward} 枚硬币。

rpg_plus/barrel/empty = 空的。连垃圾都被拿走了。
rpg_plus/barrel/found_2_coins_branches = 桶里有些零钱：2 枚硬币，1 捆柴火。
rpg_plus/barrel/found_2_coins_resin = 桶里有些零钱：2 枚硬币，1 个树脂。
rpg_plus/barrel/found_3_coins_elixir = 桶里有些零钱：3 枚硬币，1 瓶药剂。
rpg_plus/barrel/found_4_coins_resin = 桶里有些零钱：4 枚硬币，1 个树脂。
rpg_plus/desert/caravan = 商队已经离开了。价格却留了下来。没有任何东西因此便宜。
rpg_plus/desert/enemy/beetle = 甲虫在刮着沙子。过路要收肉。
rpg_plus/desert/enemy/scorpion = 蝎子高高举起尾巴。谈判很快就会结束。
rpg_plus/desert/enter = 过了最后一棵树，阴凉就没了。这里的蝎子比当地人的希望还要大。
rpg_plus/desert/house = 门上贴着一张纸条：“天凉了就回来”。墨迹已经褪色。
rpg_plus/woodland/amber/recovered = 琥珀之心留在了洞穴旁。这一次你把它带走了。
rpg_plus/woodland/beacon/1 = 一个空摇篮。这里曾经送来过光。然后又被带走了。
rpg_plus/woodland/beacon/2 = 你需要一个守望灯笼：琥珀、2 个树脂和 2 捆柴火。工作台就在村子的水井旁。
rpg_plus/woodland/beacon/3 = “光之债：三十年。”根下的声音像纸一样沙沙作响。“谁来付？”
rpg_plus/woodland/beacon/4 = 把光还给森林。让村子学会自己点灯。
rpg_plus/woodland/beacon/5 = 灯笼留给村子，并协商一份公平的契约。
rpg_plus/woodland/beacon/6 = 先想一想
rpg_plus/woodland/beacon/7 = 你把灯笼放在石头上，打开它的挡板。琥珀里长出了细细的根须。
rpg_plus/woodland/beacon/8 = “已接受。”停顿。“不提供收据。”
rpg_plus/woodland/beacon/9 = “一盏灯笼归村子。作为交换，古道之外不许动一斧子。而且，账目不由村长保管。”
rpg_plus/woodland/beacon/10 = “已同意。”石头上浮现出一个手掌印。手指太多了。你还是把自己的手按了上去。
rpg_plus/woodland/beacon/11 = 回去的路似乎轻松了些。并不是更安全了。只是这条路现在知道你的名字了。
rpg_plus/woodland/beacon/12 = 灯笼燃烧得很平稳。根下的某个人正小心翼翼地划掉一行行字。
rpg_plus/woodland/beacon/13 = 石头上长出了嫩叶。账本扎下了根。
rpg_plus/woodland/courier/1 = “包裹已送达。”信使展示空空的袋子。“收件人不肯签字。收件人有根。”
rpg_plus/woodland/courier/2 = 他递给你一张纸条：“森林并没有生气。它在计算。归还光，或者开始公平地付钱。”
rpg_plus/woodland/courier/3 = “去交给草药师吧。我就坐这儿。合同上说我有一顿午饭。合同我没有，但午饭还是该有的。”
rpg_plus/woodland/courier/4 = “去吧。我跟在后面。先得找个人来签收这些根须。”
rpg_plus/woodland/elder/1 = “狼咬死山羊，森林熄灭灯火。账本要求有一个罪魁祸首。狼早就记在上面了。”
rpg_plus/woodland/elder/2 = 狼能熄灭灯火吗？
rpg_plus/woodland/elder/3 = 我去哪儿找它？
rpg_plus/woodland/elder/4 = “不能。但写上‘未知’还得多填三张表。”
rpg_plus/woodland/elder/5 = 村长把一盏破碎的灯笼放在桌上。里面空空的摇篮有拳头那么大。
rpg_plus/woodland/elder/6 = “以前圣所里燃烧着琥珀。后来我们决定，村子更需要光。森林不同意。”
rpg_plus/woodland/elder/7 = “往东，过池塘。狼守着山洞。把它赶走。要是找到了琥珀，别卖。我们已经靠它赚过一次了。”
rpg_plus/woodland/elder/8 = “琥珀在你手里？那森林连狼都不再信任了。”
rpg_plus/woodland/elder/9 = “水井旁有一张工作台。琥珀、两个树脂和两捆柴火就能做成守望灯笼。史莱姆会留下树脂；商人那里也有存货。”
rpg_plus/woodland/elder/10 = “然后穿过山洞去圣所。那里有光需要做的事。至于是什么事，别问我。”
rpg_plus/woodland/elder/11 = “村子又能睡个好觉了。”村长数出三十五枚硬币。“这个月第一次，没有人投诉黑暗。”
rpg_plus/woodland/elder/12 = “至少现在我们知道自己拿了多少。”
rpg_plus/woodland/elder/13 = 村长熄灭了桌上的台灯。窗外，光亮越来越强。
rpg_plus/woodland/elder/14 = “光照税取消了。”他数出三十五枚硬币。“别用那种眼神看我。我也不打算设立黑暗税。至少现在不。”
rpg_plus/woodland/elder/15 = “账本已结清。山羊都活着。要是你再找到古老的谜题，先打听一下是谁在负责维护。”
rpg_plus/woodland/elder/ready = “做好了？那就穿过山洞去圣所。在你决定光为谁服务之前，别打开挡板。”
rpg_plus/woodland/hearth/1 = 火炉旁没有人要求你立下英雄的功绩。这是个难得的地方。
rpg_plus/woodland/herbalist/1 = “我的手被旧灯笼烫伤了。村长说那是普通的树脂。普通的树脂可不会咬人。”
rpg_plus/woodland/herbalist/2 = “在水井工作台上把蘑菇和史莱姆树脂混在一起。把药膏拿来给我。‘森林’说的是材料，不是保修。”
rpg_plus/woodland/herbalist/3 = “需要森林药膏。蘑菇和树脂。如果两样都没有，东边房子旁的商人会收钱卖给你。”
rpg_plus/woodland/herbalist/4 = 把森林药膏交给她
rpg_plus/woodland/herbalist/5 = 先留着
rpg_plus/woodland/herbalist/6 = 草药师用牙齿拧开盖子，默默地把药膏抹在手上。直到这时，她才去拿钱袋。
rpg_plus/woodland/herbalist/7 = “十二枚硬币。还有另一件事：一个信使把备用的灯芯带去圣所，结果没有回来。去森林南边找找。”
rpg_plus/woodland/herbalist/8 = “信使还在森林里。在小路以南。绿色背心，我有种不好的预感。”
rpg_plus/woodland/herbalist/9 = 她把纸条读了两遍。第二遍时翻了过来。背面什么也没有。
rpg_plus/woodland/herbalist/10 = “‘森林没有生气，它在计算。’”她把纸条收进口袋。“做灯笼两个树脂就够了。第三个你留着，算是送货费。”
rpg_plus/woodland/herbalist/11 = “手已经好了，信使也还活着。要是需要休息，就用水井旁的火炉。不需要处方。”
rpg_plus/woodland/lamplighter/1 = “在数灯笼。昨天七盏，今天六盏。第七盏正在数我。”
rpg_plus/woodland/lamplighter/2 = “新灯笼我擦了三遍。它一次也没要过山羊。进步了。”
rpg_plus/woodland/lamplighter/3 = “森林变亮了，村子变暗了。至少光现在不收利息了。”
rpg_plus/woodland/shrine/1 = 拱门后面有人在数数。数到“村子”就卡住，然后重新开始。
rpg_plus/woodland/waystone/1 = 石头上刻着：“去圣所：穿过东边的山洞。不要带走光。不要修改条款。”
rpg_plus/woodland/workbench/1 = 工作台上写着说明：“不要尝。不要闻。如果产品开口说话，制造者概不负责。”
