mod_rpg_plus_game_name = RPG Plus
mod_rpg_plus_game_desc = Một RPG nhỏ nhưng trọn vẹn: phần mở đầu chọn class, bí ẩn của làng và khu rừng, chế tạo, mua bán, hoang mạc và chiến đấu theo lượt — chỉ dữ liệu và kịch bản.

rpg_plus/map/village = Ngôi làng bên Rừng Xám
rpg_plus/map/elder_house = Nhà trưởng làng
rpg_plus/map/forest = Rừng Xám
rpg_plus/character/hero = Anh hùng
rpg_plus/character/slime = Slime
rpg_plus/character/companion = Lira
rpg_plus/character/wolf = Sói
rpg_plus/item/branches/name = Củi khô
rpg_plus/item/branches/desc = Cành khô từ Rừng Xám. Đồ bỏ đi, nhưng thương nhân trả một đồng cho mỗi ôm.
rpg_plus/item/stones/name = Đá
rpg_plus/item/stones/desc = Những viên đá rừng nhẵn nhụi. Chẳng hiểu sao thương nhân mua mỗi viên hai đồng.
rpg_plus/item/mushroom/name = Nấm rừng
rpg_plus/item/mushroom/desc = Một cây nấm ăn được. Hồi 5 máu.
rpg_plus/item/elixir/name = Thuốc tiên
rpg_plus/item/elixir/desc = Thuốc chữa thương màu đỏ từ cửa hàng trong làng. Hồi 20 máu.
rpg_plus/shop/village_merchant = Cửa hàng của thương nhân

rpg_plus/item/amber/name = Trái tim hổ phách
rpg_plus/item/amber/desc = Bên trong có thứ gì đó đang đập. Nhựa không nên như vậy. Một bộ phận của đèn lồng.
rpg_plus/item/fur_mantle/name = Áo choàng người canh rừng
rpg_plus/item/fur_mantle/desc = Lông thú và nhựa: +3 phòng thủ, +1 thể lực. Class nào cũng mặc được.
rpg_plus/item/resin/name = Nhựa sống
rpg_plus/item/resin/desc = Slime để lại thứ này thay cho di chúc. Cháy được cả khi mưa.
rpg_plus/item/wolf_pelt/name = Lông sói bạc
rpg_plus/item/wolf_pelt/desc = Con sói rụng lông cả sau khi chết. Ấm và dai.
rpg_plus/item/salve/name = Thuốc mỡ rừng
rpg_plus/item/salve/desc = Hồi 18 máu. Có mùi súp. Không phải súp.
rpg_plus/item/ward_lantern/name = Đèn lồng canh giữ
rpg_plus/item/ward_lantern/desc = Hổ phách nằm trong nôi nhựa. Mang đến đền thờ trong rừng.
rpg_plus/quest/ward/name = Một ánh sáng trên sổ sách
rpg_plus/quest/ward/0 = Nói chuyện với trưởng làng ở ngôi nhà phía tây. Tìm hiểu vì sao rừng đang tiến sát làng.
rpg_plus/quest/ward/1 = Hãy trừ khử con sói bên hang động ở phía đông rừng. Tìm trái tim hổ phách.
rpg_plus/quest/ward/2 = Chế tạo đèn lồng canh giữ tại bàn làm việc cạnh giếng: hổ phách, 2 nhựa, 2 bó củi. Slime rơi nhựa; thương nhân cũng bán. Rồi vào hang động phía sau con sói để đến đền thờ.
rpg_plus/quest/ward/3 = Vào hang động phía sau con sói để đến đền thờ. Quyết định ánh sáng mới sẽ phục vụ ai.
rpg_plus/quest/ward/4 = Quay lại gặp trưởng làng để nhận thù lao. Rừng đã biết câu trả lời của bạn rồi.
rpg_plus/quest/apothecary/name = Súp dùng ngoài da
rpg_plus/quest/apothecary/0 = Bà lang thuốc bên hàng rào phía tây cần thuốc cho đôi tay bị bỏng. Hãy nói chuyện với bà ấy.
rpg_plus/quest/apothecary/1 = Chế tạo thuốc mỡ rừng: nấm + nhựa sống. Dùng bàn làm việc bên giếng, rồi đưa thuốc cho bà lang.
rpg_plus/quest/courier/name = Chuyến giao hàng cuối
rpg_plus/quest/courier/0 = Tìm người đưa thư mất tích ở phía nam Rừng Xám. Bà lang đã đưa cho anh ta một bưu kiện.
rpg_plus/quest/courier/1 = Mang tờ ghi chú của người đưa thư đến cho bà lang bên hàng rào phía tây.
rpg_plus/recipe/salve/desc = Nấm và nhựa. Dùng ngoài hiệu quả hơn uống trong.
rpg_plus/recipe/mantle/desc = Lông bạc được ngâm nhựa. Giữ ấm và che chở.
rpg_plus/recipe/lantern/desc = Hổ phách, 2 nhựa và 2 bó củi. Ánh sáng cần có khung.
rpg_plus/station/name = Bàn làm việc bên giếng
rpg_plus/map/shrine = Rừng nhớ
rpg_plus/desert/map/name = Con đường khô hạn
rpg_plus/desert/enemy/scorpion/name = Bọ cạp cát
rpg_plus/desert/enemy/beetle/name = Bọ cánh cứng sa mạc
